<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gridiron</title>
<meta name="description" content="Gridiron: live NFL scores, schedule and game timelines.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gridiron">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root {
    --bg: #ffffff;
    --bg-a: rgba(255,255,255,.82);
    --text: #111111;
    --muted: #8a8a8a;
    --faint: #b8b8b8;
    --line: #ececec;
    --live: #e5484d;
    --chip: #f1f1f1;
    --dock: clamp(420px, 34vw, 540px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a0a0a;
      --bg-a: rgba(10,10,10,.8);
      --text: #ededed;
      --muted: #7a7a7a;
      --faint: #4a4a4a;
      --line: #1c1c1c;
      --live: #ff6369;
      --chip: #161616;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.45 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    font-variant-numeric: tabular-nums;
  }

  /* ---- Page frame ------------------------------------------------------- */
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 16px calc(64px + env(safe-area-inset-bottom)); }
  @media (min-width: 980px) { .wrap { max-width: 1480px; padding: 0 32px 80px; } }

  /* Sticky top bar: brand, week and week arrows; sort chips join it when games are live. */
  .top {
    position: sticky; top: 0; z-index: 20;
    background: var(--bg-a); backdrop-filter: saturate(1.6) blur(14px); -webkit-backdrop-filter: saturate(1.6) blur(14px);
    border-bottom: 1px solid transparent; transition: border-color .2s;
  }
  .top.stuck { border-bottom-color: var(--line); }
  .topin {
    max-width: 720px; margin: 0 auto; padding: calc(14px + env(safe-area-inset-top)) 16px 12px;
    display: grid; grid-template-columns: 1fr auto; align-items: center; row-gap: 12px;
  }
  @media (min-width: 980px) {
    .topin { max-width: 1480px; padding: 18px 32px; display: flex; gap: 20px; }
  }
  .wk { display: grid; min-width: 0; }
  @media (min-width: 980px) { .wk { display: flex; align-items: baseline; gap: 18px; } }
  .brand { font-size: 12px; font-weight: 800; letter-spacing: .22em; text-transform: uppercase; color: var(--live); }
  .weeklabel { font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .weeklabel small { margin-left: 8px; color: var(--muted); font-weight: 400; font-size: 14px; }
  .weeknav { display: flex; gap: 4px; }
  .weeknav button {
    appearance: none; border: 0; background: var(--chip); color: var(--text);
    font: inherit; font-size: 16px; width: 34px; height: 34px; cursor: pointer; border-radius: 50%;
  }
  .weeknav button:hover:not(:disabled) { background: var(--line); }
  .weeknav button:disabled { color: var(--faint); opacity: .5; cursor: default; }

  /* Sort chips */
  .sortbar { grid-column: 1 / -1; display: flex; gap: 6px; margin: 0 -16px; padding: 0 16px; overflow-x: auto; scrollbar-width: none; }
  .sortbar[hidden] { display: none; }
  .sortbar::-webkit-scrollbar { display: none; }
  @media (min-width: 980px) { .sortbar { margin: 0 0 0 auto; padding: 0; } }
  .sortbar button {
    flex: none; appearance: none; border: 0; cursor: pointer; font: inherit; font-size: 13px; font-weight: 600;
    padding: 7px 13px; border-radius: 999px; background: var(--chip); color: var(--muted);
  }
  .sortbar button:hover { color: var(--text); }
  .sortbar button.on { background: var(--text); color: var(--bg); }

  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 11px; color: var(--muted); margin-top: 8px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .legend svg { overflow: visible; }
  .legend .hint { color: var(--text); opacity: .7; }
  .legend .hint.touch { display: none; }
  @media (hover: none) { .legend .hint.mouse { display: none; } .legend .hint.touch { display: inline-flex; } }
  @media (min-width: 980px) { .legend { margin-top: 4px; } }

  .day { margin-top: 28px; }
  .dayhead { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .dayhead.now { color: var(--text); font-weight: 600; }
  .livehead { color: var(--live) !important; }
  .livehead::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--live); margin-right: 8px; vertical-align: 1px; animation: pulse 1.4s infinite; }

  /* One column on phones, as many ~380px+ columns as fit on wider screens. */
  .games { display: grid; gap: 12px; margin-top: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); }
  @media (min-width: 1700px) { .games { grid-template-columns: repeat(auto-fill, minmax(480px, 1fr)); } }

  /* ---- Matchup tile ------------------------------------------------------
     Away color on the left, home color on the right, split on a diagonal.
     Light falls from the top outer corners; a fine sheen marks the seam. */
  .game {
    --a: #333; --h: #333;
    position: relative; isolation: isolate; overflow: hidden;
    display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr auto auto;
    min-height: 112px; border-radius: 18px; color: #fff;
    background:
      radial-gradient(70% 90% at 0% 0%, rgba(255,255,255,.16), transparent 70%),
      radial-gradient(70% 90% at 100% 0%, rgba(255,255,255,.16), transparent 70%),
      linear-gradient(102deg, transparent calc(50% - 1px), rgba(255,255,255,.28) 50%, transparent calc(50% + 1px)),
      linear-gradient(180deg, rgba(255,255,255,.04), rgba(0,0,0,.24)),
      linear-gradient(102deg, var(--a) calc(50% - .5px), var(--h) calc(50% + .5px));
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.08);
    cursor: pointer; transition: transform .15s ease, box-shadow .15s ease;
    outline: none;
  }
  .game:active { transform: scale(.985); }
  @media (hover: hover) {
    .games .game:hover { box-shadow: inset 0 0 0 1px rgba(255,255,255,.16), 0 10px 30px -10px rgba(0,0,0,.6); }
  }
  .game:focus-visible { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--text); }
  .game.sel { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--text); }

  .side { position: relative; display: flex; align-items: center; gap: 12px; padding: 36px 16px 22px; min-width: 0; }
  .side.home { flex-direction: row-reverse; text-align: right; }
  .side .logo { flex: none; width: 44px; height: 44px; object-fit: contain; filter: drop-shadow(0 2px 6px rgba(0,0,0,.35)); }
  .side .id { min-width: 0; flex: 1; display: grid; }
  .side .ab { font-size: 22px; font-weight: 800; letter-spacing: .02em; line-height: 1.05; }
  .side .nm { font-size: 12px; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .side .sc { flex: none; font-size: 34px; font-weight: 800; line-height: 1; margin: 0 14px; text-shadow: 0 2px 10px rgba(0,0,0,.25); }
  .side.away .sc { margin-left: 0; }
  .side.home .sc { margin-right: 0; }
  /* Losing side of a final steps back: score dims, identity stays legible. */
  .final .side.lost .sc { opacity: .45; }
  .final .side.lost .id { opacity: .7; }
  .final .side.lost .logo { opacity: .8; }

  /* Status tag hangs from the top of the seam. */
  .pill {
    position: absolute; left: 50%; top: 10px; transform: translateX(-50%); z-index: 3;
    background: var(--bg); color: var(--text); border-radius: 999px;
    padding: 4px 10px; line-height: 1.2; white-space: nowrap;
    box-shadow: 0 3px 10px rgba(0,0,0,.25); font-size: 11px; font-weight: 700; letter-spacing: .02em;
  }
  .pill small { font-size: 11px; font-weight: 600; color: var(--muted); margin-left: 4px; }
  .pill small::before { content: "· "; }
  .pill.live { background: var(--live); color: #fff; }
  .pill.live small { color: rgba(255,255,255,.85); }
  .pill.live::before {
    content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: #fff; margin-right: 6px; vertical-align: 1px; animation: pulse 1.4s infinite;
  }
  @keyframes pulse { 50% { opacity: .2; } }

  /* ---- Game timeline ----------------------------------------------------
     Away events sit above the midline, home events below. The line is home
     win probability; the shaded band is how far it sits from a coin flip. */
  .tl {
    --area-a: rgba(255,255,255,.18); --area-h: rgba(255,255,255,.18); --wp: rgba(255,255,255,.85);
    grid-column: 1 / -1; position: relative; height: 56px; margin: 0 12px 12px;
    border-radius: 10px; background: rgba(0,0,0,.28); overflow: hidden;
    touch-action: pan-y; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    outline: none;
  }
  @media (hover: hover) { .tl { cursor: crosshair; } }
  .tl:focus-visible { box-shadow: 0 0 0 2px #fff; }
  .tl .q { position: absolute; top: 0; bottom: 0; border-left: 1px solid rgba(255,255,255,.12); }
  .tl .q span { position: absolute; top: 3px; left: 4px; font-size: 9px; font-weight: 700; color: rgba(255,255,255,.4); }
  .tl .mid { position: absolute; left: 0; right: 0; top: 50%; border-top: 1px dashed rgba(255,255,255,.15); }
  .tl > svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .tl .wp { fill: none; stroke: var(--wp); stroke-width: 1.5; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
  .tl .area.a { fill: var(--area-a); }
  .tl .area.h { fill: var(--area-h); }
  .tl .fut { position: absolute; top: 0; bottom: 0; right: 0; background: rgba(0,0,0,.30); }
  .tl .now { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: #fff; box-shadow: 0 0 6px rgba(255,255,255,.8); }
  .tl .ev {
    position: absolute; transform: translate(-50%, -50%); z-index: 1; display: block; line-height: 0;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,.45)); transition: transform .12s ease;
  }
  .tl .ev.td { z-index: 2; }
  .tl .ev.on { transform: translate(-50%, -50%) scale(1.3); z-index: 4; }
  .tl .ev svg { display: block; overflow: visible; }
  .tl .ev.away { top: 27%; }
  .tl .ev.home { top: 73%; }
  .tdb {
    display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%;
    background: #fff; box-shadow: 0 0 0 2px var(--c);
  }
  .tdb img { width: 15px; height: 15px; object-fit: contain; }
  .legend .tdb { width: 14px; height: 14px; box-shadow: 0 0 0 1.5px var(--muted); }
  .legend .tdb img { width: 10px; height: 10px; }

  /* Scrub cursor: a hairline down the chart with a dot riding the line. */
  .tl .cur { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1px solid rgba(255,255,255,.95); margin-left: -.5px; pointer-events: none; z-index: 3; }
  .tl .cur i { position: absolute; left: 0; width: 9px; height: 9px; margin: -4.5px 0 0 -5px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 3px rgba(0,0,0,.35); }
  .tl.scrub .ev:not(.on) { opacity: .55; }

  /* Large version in the game details. */
  .flow { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: stretch; }
  .flow .ylab { display: flex; flex-direction: column; justify-content: space-between; padding: 6px 0; font-size: 11px; font-weight: 700; color: var(--muted); }
  .flow .ylab span { display: flex; align-items: center; gap: 6px; }
  .flow .ylab img { width: 18px; height: 18px; object-fit: contain; }
  .flow .ylab em { font-style: normal; font-weight: 500; text-align: center; opacity: .7; }
  .tl.big {
    --area-a: color-mix(in srgb, var(--a) 42%, transparent);
    --area-h: color-mix(in srgb, var(--h) 42%, transparent);
    --wp: var(--text);
    grid-column: auto; height: 190px; margin: 0; background: var(--chip); border-radius: 12px;
  }
  @media (min-width: 700px) { .tl.big { height: 220px; } }
  .tl.big:focus-visible { box-shadow: 0 0 0 2px var(--text); }
  .tl.big .q { border-left-color: var(--line); }
  .tl.big .q span { top: auto; bottom: 4px; color: var(--muted); }
  .tl.big .mid { border-top-color: color-mix(in srgb, var(--text) 18%, transparent); }
  .tl.big .ev.away { top: 12%; }
  .tl.big .ev.home { top: 88%; }
  .tl.big .wp { stroke-width: 2; }
  .tl.big .cur { border-left-color: var(--text); }
  .tl.big .cur i { background: var(--text); box-shadow: 0 0 0 3px var(--chip); }
  .tl.big .fut { background: color-mix(in srgb, var(--bg) 50%, transparent); }

  /* Floating play card. Always dark so it reads over any team color. */
  .tip {
    position: fixed; z-index: 10000; width: min(320px, calc(100vw - 16px)); pointer-events: none;
    background: rgba(18,18,20,.96); color: #f2f2f2; border-radius: 14px; padding: 12px 14px 12px;
    box-shadow: 0 12px 40px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.08);
    font-size: 13px; line-height: 1.4; backdrop-filter: blur(10px);
  }
  .tip[hidden] { display: none; }
  .tip .th { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .tip .th img { width: 22px; height: 22px; object-fit: contain; }
  .tip .th b { font-size: 13px; }
  .tip .th .clk { color: rgba(255,255,255,.55); }
  .tip .tag {
    margin-left: auto; font-style: normal; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em;
    padding: 3px 7px; border-radius: 5px; background: var(--c, #555); color: #fff; box-shadow: inset 0 0 0 1px rgba(255,255,255,.25);
  }
  .tip .tag.to { background: #b42318; }
  .tip .tag.pen { background: #ca8a04; }
  .tip .dd { margin-top: 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: rgba(255,255,255,.55); }
  .tip p { margin: 3px 0 0; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .tip .tf { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; font-size: 12px; }
  .tip .tf b { font-size: 14px; }
  .tip .swing { font-weight: 800; font-size: 12px; color: #4ade80; white-space: nowrap; }
  .tip .swing.dn { color: #f87171; }
  .tip .bar { display: flex; gap: 2px; height: 5px; margin-top: 8px; border-radius: 3px; overflow: hidden; }
  .tip .bar i { display: block; min-width: 2px; }
  .tip .bl { display: flex; justify-content: space-between; margin-top: 4px; font-size: 11px; color: rgba(255,255,255,.6); }
  .tip .bl b { color: #fff; }

  /* ---- Live game extras ------------------------------------------------- */
  .ball {
    display: inline-block; width: 12px; height: 8px; margin-left: 6px; vertical-align: 4px;
    background: #8b4a22; border-radius: 50%; box-shadow: 0 0 0 1.5px #fff;
    position: relative;
  }
  .ball::after { content: ""; position: absolute; left: 3px; right: 3px; top: 3.5px; height: 1px; background: #fff; }
  .tos { display: inline-flex; gap: 3px; vertical-align: middle; }
  .tos b { width: 10px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.25); }
  .tos b.on { background: #fff; }

  .field { grid-column: 1 / -1; margin: 0 12px 8px; }
  .pitch {
    position: relative; height: 22px; border-radius: 6px; overflow: hidden;
    background: rgba(0,0,0,.28);
  }
  .pitch .ez { position: absolute; top: 0; bottom: 0; width: 8%; }
  .pitch .ez.a { left: 0; background: color-mix(in srgb, var(--a) 80%, #000); }
  .pitch .ez.h { right: 0; background: color-mix(in srgb, var(--h) 80%, #000); }
  .pitch .yl { position: absolute; top: 0; bottom: 0; border-left: 1px solid rgba(255,255,255,.14); }
  .pitch .yl.fifty { border-left-color: rgba(255,255,255,.3); }
  .pitch .gain { position: absolute; top: 4px; bottom: 4px; background: rgba(255,255,255,.18); }
  .pitch .fd { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: #ffd400; box-shadow: 0 0 6px #ffd400; }
  .pitch .fb {
    position: absolute; top: 50%; width: 14px; height: 9px; margin: -4.5px 0 0 -7px; z-index: 1;
    background: #8b4a22; border-radius: 50%; box-shadow: 0 0 0 1.5px #fff, 0 0 10px rgba(255,255,255,.6);
  }
  .pitch .fb::after { content: ""; position: absolute; top: 50%; border: 4px solid transparent; margin-top: -4px; }
  .pitch .fb.r::after { left: 100%; margin-left: 3px; border-left-color: #fff; }
  .pitch .fb.l::after { right: 100%; margin-right: 3px; border-right-color: #fff; }
  .sit { margin-top: 6px; font-size: 12px; font-weight: 700; display: flex; gap: 8px; align-items: baseline; min-width: 0; }
  .sit .last { font-weight: 400; opacity: .75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
  .rzt { background: var(--live); color: #fff; font-size: 10px; text-transform: uppercase; letter-spacing: .05em; padding: 2px 6px; border-radius: 4px; flex: none; }
  .game.rz { box-shadow: inset 0 0 0 2px var(--live), 0 0 24px color-mix(in srgb, var(--live) 35%, transparent); }

  /* Score change: the number pops and its side flashes. */
  .side.bump .sc { animation: pop 1.2s ease-out; }
  .side.bump::before {
    content: ""; position: absolute; inset: 0; z-index: -1; background: #fff; opacity: 0;
    animation: flash 1.6s ease-out;
  }
  @keyframes pop { 0% { transform: scale(1); } 15% { transform: scale(1.45); } 100% { transform: scale(1); } }
  @keyframes flash { 0% { opacity: .35; } 100% { opacity: 0; } }

  /* ---- Details: modal on tablets, docked side panel on desktop ------------ */
  body.locked { overflow: hidden; }
  .sheet { position: fixed; inset: 0; z-index: 50; }
  .sheet[hidden] { display: none; }
  .scrim { position: absolute; inset: 0; background: rgba(0,0,0,.55); backdrop-filter: blur(3px); animation: fade .2s ease; }
  .panel {
    position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);
    width: min(640px, 100%); max-height: 94vh; overflow-y: auto; overscroll-behavior: contain;
    background: var(--bg); border-radius: 22px 22px 0 0; padding: 0 0 40px;
    box-shadow: 0 -10px 40px rgba(0,0,0,.35); animation: rise .28s cubic-bezier(.2,.8,.2,1);
  }
  @media (min-width: 700px) { .panel { bottom: auto; top: 4vh; max-height: 92vh; border-radius: 22px; } }
  @keyframes rise { from { transform: translate(-50%, 40px); opacity: 0; } }
  @keyframes fade { from { opacity: 0; } }
  @keyframes slidein { from { transform: translateX(40px); opacity: 0; } }

  @media (min-width: 1180px) {
    body.docked { padding-right: var(--dock); }
    body.docked .sheet { left: auto; width: var(--dock); z-index: 30; }
    body.docked .scrim { display: none; }
    body.docked .panel {
      inset: 0; transform: none; width: 100%; max-height: none; border-radius: 0;
      border-left: 1px solid var(--line); box-shadow: -20px 0 50px -20px rgba(0,0,0,.35);
      animation: slidein .25s cubic-bezier(.2,.8,.2,1);
    }
    body.docked .hero .game { border-radius: 0; }
  }

  .x {
    position: sticky; top: 10px; float: right; margin: 10px 10px -46px 0; z-index: 10;
    width: 36px; height: 36px; border-radius: 50%; border: 0; cursor: pointer;
    background: rgba(0,0,0,.45); color: #fff; font-size: 22px; line-height: 1; backdrop-filter: blur(6px);
  }
  .x:hover { background: rgba(0,0,0,.65); }
  /* Cupertino Pane (mobile sheet) */
  :root {
    --cupertino-pane-background: var(--bg);
    --cupertino-pane-color: var(--text);
    --cupertino-pane-border-radius: 22px;
    --cupertino-pane-shadow: 0 -10px 40px rgba(0,0,0,.35);
    --cupertino-pane-move-background: rgba(255,255,255,.75);
  }
  .pane-sheet { padding: 0 !important; }
  .pane-sheet .sheet-body { padding-bottom: calc(40px + env(safe-area-inset-bottom)); }
  .pane-sheet .x { position: absolute; top: 12px; right: 12px; float: none; margin: 0; }
  .cupertino-pane-wrapper .backdrop { z-index: 40 !important; }
  .cupertino-pane-wrapper .pane { overflow: hidden; padding-top: 0 !important; z-index: 41 !important; }
  /* Grab handle floats over the team-color header. */
  .cupertino-pane-wrapper .draggable { z-index: 20; top: 0 !important; pointer-events: none; }
  .cupertino-pane-wrapper .draggable .move { background: rgba(255,255,255,.7) !important; box-shadow: 0 1px 4px rgba(0,0,0,.3); }

  /* Big header: each team stacked like a scoreboard so nothing truncates. */
  .hero .game .side, .hero .game .side.home { flex-direction: column; justify-content: center; text-align: center; gap: 6px; }
  .hero .game .side .id { justify-items: center; flex: none; }
  .hero .game .side .sc { margin: 0; }
  .hero .game { border-radius: 22px 22px 0 0; cursor: default; min-height: 150px; box-shadow: none; }
  .hero .game:active { transform: none; }
  .hero .game .side { padding-top: 64px; padding-bottom: 22px; }
  .hero .game .pill { top: 30px; }
  .hero .game .sc { font-size: 46px; }
  .hero .game .logo { width: 56px; height: 56px; }

  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px 16px; margin: 0; padding: 18px 16px; border-bottom: 1px solid var(--line); }
  .facts dt { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .facts dd { margin: 2px 0 0; font-size: 14px; font-weight: 600; }

  .sec { padding: 20px 16px 4px; }
  .sec h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; margin: 0 0 12px; }
  .sec h3 span { text-transform: none; letter-spacing: 0; color: var(--muted); font-weight: 500; margin-left: 6px; }

  .plays { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 13px; }
  .plays li { padding: 10px 12px; border-radius: 10px; background: var(--chip); }
  .plays li b { display: block; font-size: 11px; color: var(--muted); margin-bottom: 2px; }
  .plays li:first-child { background: color-mix(in srgb, var(--live) 14%, var(--chip)); }

  /* Plays that drive the chart cursor when hovered. */
  [data-focus] { cursor: default; transition: background .12s; border-radius: 10px; }
  @media (hover: hover) { [data-focus]:hover, [data-focus].on { background: var(--chip); } }

  .swings { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .swings li { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: start; padding: 10px 8px 10px 10px; font-size: 13px; border-left: 3px solid var(--c); border-radius: 0 10px 10px 0; }
  .swings img { width: 28px; height: 28px; object-fit: contain; }
  .swings b { font-size: 12px; }
  .swings .clk { color: var(--muted); font-size: 12px; margin-left: 4px; }
  .swings p { margin: 1px 0 0; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .swings .amt { font-weight: 800; font-size: 15px; white-space: nowrap; }

  .linescore { width: 100%; border-collapse: collapse; font-size: 14px; text-align: center; }
  .linescore th { font-size: 11px; color: var(--muted); font-weight: 600; padding: 4px; }
  .linescore td { padding: 8px 4px; border-top: 1px solid var(--line); }
  .linescore .tm { text-align: left; font-weight: 700; white-space: nowrap; }
  .linescore .tm img { width: 20px; height: 20px; vertical-align: -5px; margin-right: 8px; }
  .linescore .tot { font-weight: 800; font-size: 16px; }

  .scoring { list-style: none; margin: 0; padding: 0; }
  .scoring .qh { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; padding: 10px 0 6px; }
  .scoring .sp { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: start; padding: 10px 8px 10px 10px; border-left: 3px solid var(--c); margin-bottom: 6px; border-radius: 0 10px 10px 0; }
  .scoring .sp img { width: 28px; height: 28px; object-fit: contain; }
  .scoring .sp b { font-size: 13px; }
  .scoring .spk { vertical-align: -1px; margin-right: 2px; overflow: visible; }
  .scoring .sp .clk { font-size: 12px; color: var(--muted); }
  .scoring .sp p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
  .scoring .run { font-weight: 800; font-size: 14px; white-space: nowrap; }

  .stats { display: grid; gap: 12px; }
  .st { display: grid; grid-template-columns: 64px 1fr 64px; align-items: center; row-gap: 5px; font-size: 13px; }
  .st .v { font-weight: 700; }
  .st .v:last-of-type { text-align: right; }
  .st .lbl { text-align: center; color: var(--muted); font-size: 12px; }
  .st .bar { grid-column: 1 / -1; display: flex; gap: 3px; height: 6px; }
  .st .bar i { display: block; border-radius: 3px; min-width: 3px; }

  .leaders { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .leaders h4 { margin: 0 0 8px; font-size: 13px; padding-left: 8px; border-left: 3px solid var(--c); }
  .leaders ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .leaders li { display: flex; gap: 10px; align-items: center; min-width: 0; }
  .leaders img, .leaders .ph { flex: none; width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: var(--chip); }
  .leaders li div { min-width: 0; display: grid; }
  .leaders b { font-size: 13px; }
  .leaders span { font-size: 12px; color: var(--muted); }

  /* Phones: tiles run edge to edge. */
  @media (max-width: 600px) {
    .games { margin: 12px -16px 0; gap: 6px; }
    .game { border-radius: 0; box-shadow: none; }
    .game.sel { box-shadow: none; }
    .tl { margin: 0 10px 10px; }
  }
  @media (max-width: 400px) {
    .side { padding: 36px 12px 20px; gap: 8px; }
    .side .logo { width: 34px; height: 34px; }
    .side .ab { font-size: 19px; }
    .side .sc { font-size: 28px; margin: 0 10px; }
  }

  .byes { margin-top: 32px; color: var(--muted); font-size: 12px; }
  .msg { color: var(--muted); padding: 48px 0; font-size: 14px; }
  footer { margin-top: 40px; color: var(--faint); font-size: 12px; display: flex; gap: 16px; flex-wrap: wrap; }
  footer button { background: none; border: 0; padding: 0; color: inherit; cursor: pointer; font: inherit; }
  footer button:hover { color: var(--text); }
  footer kbd { font: inherit; border: 1px solid var(--faint); border-radius: 4px; padding: 0 4px; }
  @media (hover: none) { footer .keys { display: none; } }
  footer .credits { margin-left: auto; }
  footer a { color: var(--muted); text-decoration: none; }
  footer a:hover { color: var(--text); text-decoration: underline; text-underline-offset: 2px; }
</style>
</head>
<body>
<header class="top" id="top">
  <div class="topin">
    <div class="wk">
      <div class="brand">Gridiron</div>
      <div class="weeklabel" id="weeklabel">…</div>
    </div>
    <div class="weeknav">
      <button id="prev" aria-label="Previous week" title="Previous week (←)">←</button>
      <button id="next" aria-label="Next week" title="Next week (→)">→</button>
    </div>
    <div class="sortbar" id="sortbar" hidden></div>
  </div>
</header>
<div class="wrap">
  <div class="legend" id="legend" aria-hidden="true"></div>
  <main id="main"><div class="msg">Loading games…</div></main>
  <footer>
    <button id="refresh"><span id="updated"></span></button>
    <span class="keys"><kbd>←</kbd> <kbd>→</kbd> weeks · <kbd>J</kbd> <kbd>K</kbd> games · <kbd>Esc</kbd> close</span>
    <span class="credits">Made by <a href="https://shaunandrews.com" rel="author">Shaun Andrews</a> · <a href="https://github.com/shaunandrews/football">GitHub</a></span>
  </footer>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="scrim" data-close></div>
  <div class="panel" role="dialog" aria-label="Game details">
    <button class="x" data-close aria-label="Close">×</button>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/cupertino-pane@1.5.4/dist/cupertino-pane.min.js"></script>
<script>
const API = "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard";
const $ = (id) => document.getElementById(id);

let weeks = [];        // [{seasontype, week, label, detail, start, end}]
let idx = -1;          // index into weeks currently shown
let year = null;
let timer = null;
let currentEvents = new Map(); // id -> scoreboard event for the week on screen
const rawSummaries = new Map(); // id -> { raw, at } full ESPN game summary
const summaries = new Map();    // id -> parsed timeline data
let sortMode = "day";
try { sortMode = localStorage.getItem("sort") || "day"; } catch {}

const mobileQuery = matchMedia("(max-width: 699px)");
const dockQuery = matchMedia("(min-width: 1180px)");

// ---- Live sorting ------------------------------------------------------------
const SORTS = [
  ["day", "By day"],
  ["live", "Live first"],
  ["close", "Closest"],
  ["thriller", "Nail-biters"],
  ["ending", "Ending soon"],
];
function margin(ev) {
  const [a, b] = ev.competitions[0].competitors.map(c => Number(c.score) || 0);
  return Math.abs(a - b);
}
function gameElapsed(ev) {
  const st = ev.status;
  return st.period ? elapsed(st.period, st.displayClock) : 0;
}
function homeWin(ev) {
  const p = ev.competitions[0].situation?.lastPlay?.probability?.homeWinPercentage;
  return typeof p === "number" ? p : (summaries.get(ev.id)?.wp?.at(-1)?.[1] ?? 0.5);
}
function sortLive(list) {
  const by = {
    live: (a, b) => new Date(a.date) - new Date(b.date),
    close: (a, b) => margin(a) - margin(b) || gameElapsed(b) - gameElapsed(a),
    thriller: (a, b) => Math.abs(homeWin(a) - 0.5) - Math.abs(homeWin(b) - 0.5),
    ending: (a, b) => gameElapsed(b) - gameElapsed(a),
  }[sortMode];
  return by ? list.slice().sort(by) : list;
}
function renderSortbar(liveCount) {
  const bar = $("sortbar");
  bar.hidden = !liveCount;
  if (!liveCount) return;
  const html = SORTS.map(([k, label]) =>
    `<button data-sort="${k}" class="${k === sortMode ? "on" : ""}">${label}</button>`).join("");
  if (bar.innerHTML !== html) bar.innerHTML = html;
}

function buildWeeks(league) {
  const out = [];
  for (const group of league.calendar || []) {
    if (!group.entries || group.value === "1") continue; // skip preseason + offseason
    for (const e of group.entries) {
      out.push({
        seasontype: group.value, week: e.value,
        label: e.label, detail: e.detail,
        start: new Date(e.startDate), end: new Date(e.endDate),
      });
    }
  }
  return out;
}

async function fetchBoard(params) {
  const qs = new URLSearchParams(params).toString();
  const res = await fetch(API + (qs ? "?" + qs : ""), { cache: "no-store" });
  if (!res.ok) throw new Error("ESPN returned " + res.status);
  return res.json();
}

async function init() {
  try {
    const data = await fetchBoard({});
    const league = data.leagues[0];
    year = league.season.year;
    weeks = buildWeeks(league);
    const st = String(data.season?.type ?? league.season.type.type);
    const wk = String(data.week?.number);
    idx = weeks.findIndex(w => w.seasontype === st && w.week === wk);
    if (idx === -1) {
      // Offseason / preseason: pick the next upcoming week, else the last one.
      const now = new Date();
      idx = weeks.findIndex(w => w.end > now);
      if (idx === -1) idx = weeks.length - 1;
      await loadWeek();
    } else {
      render(data);
    }
  } catch (err) {
    showError(err);
  }
}

let loadSeq = 0;
// silent = background refresh: keep what's on screen and patch it in place.
async function loadWeek(silent = false) {
  const w = weeks[idx];
  const seq = ++loadSeq;
  updateNav();
  if (!silent) { hideScrub(); $("main").innerHTML = '<div class="msg">Loading games…</div>'; }
  try {
    const data = await fetchBoard({ seasontype: w.seasontype, week: w.week, dates: year });
    if (seq !== loadSeq) return; // user moved to another week meanwhile
    render(data);
  } catch (err) {
    if (!silent) showError(err);
    else stamp(true); // try again on the next tick
  }
}

function updateNav() {
  const w = weeks[idx];
  if (!w) return;
  $("weeklabel").innerHTML = `${esc(w.label)}<small>${esc(w.detail || "")}</small>`;
  $("prev").disabled = idx <= 0;
  $("next").disabled = idx >= weeks.length - 1;
}

function dayKey(d) { return d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate(); }

function dayLabel(d) {
  const today = new Date();
  const tomorrow = new Date(today); tomorrow.setDate(today.getDate() + 1);
  const yesterday = new Date(today); yesterday.setDate(today.getDate() - 1);
  const k = dayKey(d);
  if (k === dayKey(today)) return { name: "Today", now: true };
  if (k === dayKey(tomorrow)) return { name: "Tomorrow", now: false };
  if (k === dayKey(yesterday)) return { name: "Yesterday", now: false };
  return { name: d.toLocaleDateString(undefined, { weekday: "long" }), now: false };
}

function render(data) {
  updateNav();
  const events = (data.events || []).slice().sort((a, b) => new Date(a.date) - new Date(b.date));
  if (!events.length) {
    $("main").innerHTML = '<div class="msg">No games scheduled this week.</div>';
    stamp(false);
    return;
  }

  currentEvents = new Map(events.map(e => [e.id, e]));
  const live = events.filter(e => e.status?.type?.state === "in");
  renderSortbar(live.length);
  const pullLive = live.length && sortMode !== "day";
  const rest = pullLive ? events.filter(e => e.status.type.state !== "in") : events;

  const groups = new Map();
  for (const ev of rest) {
    const d = new Date(ev.date);
    const k = dayKey(d);
    if (!groups.has(k)) groups.set(k, { date: d, games: [] });
    groups.get(k).games.push(ev);
  }

  let html = "";
  if (pullLive) {
    html += `<section class="day"><div class="dayhead now livehead">Live now · ${live.length}</div>`;
    html += `<div class="games">${sortLive(live).map(e => gameCard(e)).join("")}</div></section>`;
  }
  for (const { date, games } of groups.values()) {
    const lbl = dayLabel(date);
    const dateStr = date.toLocaleDateString(undefined, { month: "short", day: "numeric" });
    html += `<section class="day"><div class="dayhead${lbl.now ? " now" : ""}">${lbl.name} · ${dateStr}</div>`;
    html += `<div class="games">${games.map(e => gameCard(e)).join("")}</div>`;
    html += `</section>`;
  }

  const byes = data.week?.teamsOnBye || [];
  if (byes.length) {
    html += `<div class="byes">Bye — ${byes.map(t => esc(t.shortDisplayName || t.displayName)).join(", ")}</div>`;
  }

  patchMain(html);
  markSelected();
  restoreScrub();
  refreshSheet();
  loadTimelines(events);
  const anyLive = events.some(e => e.status?.type?.state === "in");
  const startsSoon = events.some(e => e.status?.type?.state === "pre" && new Date(e.date) - Date.now() < 15 * 60 * 1000 && new Date(e.date) > Date.now() - 3600e3);
  stamp(anyLive || startsSoon);
}


// ---- Timeline data -----------------------------------------------------------
function secs(clock) {
  const [m, s] = String(clock || "0:00").split(":").map(Number);
  return (m || 0) * 60 + (s || 0);
}
function elapsed(period, clock) {
  const left = secs(clock);
  return period <= 4 ? (period - 1) * 900 + (900 - left) : 3600 + (period - 5) * 600 + (600 - left);
}
const qLabel = (p) => (p <= 4 ? "Q" + p : p === 5 ? "OT" : "OT" + (p - 4));

// Administrative entries that aren't worth a card of their own.
const NOISE = /timeout|end of|end period|two-minute|coin toss/i;

function parseSummary(sum) {
  const drives = [...(sum.drives?.previous || []), ...(sum.drives?.current ? [sum.drives.current] : [])];
  const wpBy = new Map((sum.winprobability || []).map(w => [w.playId, w.homeWinPercentage]));
  const all = [], plays = [];
  let prev = null;
  for (const d of drives) for (const p of d.plays || []) {
    const per = p.period?.number || 1;
    const t = elapsed(per, p.clock?.displayValue);
    const w = wpBy.get(p.id);
    all.push([t, w]);
    const play = {
      id: p.id, t, per, clock: p.clock?.displayValue || "",
      text: (p.text || "").trim(), type: p.type?.text || "",
      dd: p.start?.down ? p.start.downDistanceText || "" : "",
      team: p.start?.team?.id || d.team?.id,
      a: p.awayScore, h: p.homeScore,
      wp: w ?? prev, dwp: w != null && prev != null ? w - prev : 0,
      score: !!p.scoringPlay, to: !!p.isTurnover, pen: !!p.isPenalty,
    };
    if (w != null) prev = w;
    // ESPN often prices a score before the try, then corrects on the kickoff
    // that follows. Credit that correction to the score itself.
    const last = plays.at(-1);
    if (/^kickoff$/i.test(play.type) && last?.score && last.per === per) { last.dwp += play.dwp; play.dwp = 0; }
    if (play.text && !NOISE.test(play.type)) plays.push(play);
  }
  const scores = (sum.scoringPlays || []).map(p => ({
    id: p.id,
    t: elapsed(p.period?.number || 1, p.clock?.displayValue), team: p.team?.id,
    label: { TD: "TD", FG: "FG", SF: "SF" }[p.scoringType?.abbreviation || p.type?.abbreviation] || "PTS",
  }));
  const wp = all.filter(([, w]) => w != null);
  const maxPeriod = Math.max(4, ...plays.map(p => p.per));
  return { scores, wp, plays, maxPeriod };
}

function teamsOf(ev) {
  const comp = ev.competitions[0];
  return {
    home: comp.competitors.find(c => c.homeAway === "home"),
    away: comp.competitors.find(c => c.homeAway === "away"),
  };
}
function totalSecs(ev, data) {
  const periods = Math.max(data?.maxPeriod || 4, ev.status.period || 4);
  return 3600 + Math.max(0, periods - 4) * 600;
}
const xPct = (t, total) => 3 + 94 * Math.max(0, Math.min(1, t / total));

// The shaded band between the line and 50%, split into an "away ahead" half
// above the midline and a "home ahead" half below it.
function areaPaths(pts) {
  const top = [], bot = [];
  pts.forEach(([x, y], i) => {
    if (i) {
      const [px, py] = pts[i - 1];
      if ((py - 50) * (y - 50) < 0) {
        const cx = px + (x - px) * (50 - py) / (y - py);
        top.push([cx, 50]); bot.push([cx, 50]);
      }
    }
    top.push([x, Math.min(y, 50)]);
    bot.push([x, Math.max(y, 50)]);
  });
  const d = (arr) => `M${arr[0][0].toFixed(2)},50 ${arr.map(([x, y]) => `L${x.toFixed(2)},${y.toFixed(1)}`).join(" ")} L${arr.at(-1)[0].toFixed(2)},50Z`;
  return `<path class="area a" d="${d(top)}"/><path class="area h" d="${d(bot)}"/>`;
}

function timeline(ev, data) {
  const st = ev.status;
  const { home, away } = teamsOf(ev);
  const total = totalSecs(ev, data);
  const x = (t) => xPct(t, total);
  const periods = Math.round((total - 3600) / 600) + 4;

  let html = "";
  for (let p = 1; p <= periods; p++) {
    const start = p <= 4 ? (p - 1) * 900 : 3600 + (p - 5) * 600;
    html += `<div class="q" style="left:${x(start)}%"><span>${qLabel(p)}</span></div>`;
  }
  html += '<div class="mid"></div>';
  if (!data) return html;

  if (data.wp.length > 1) {
    const pts = data.wp.map(([t, h]) => [x(t), h * 100]);
    html += `<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">${areaPaths(pts)}<polyline class="wp" points="${pts.map(([a, b]) => `${a.toFixed(2)},${b.toFixed(1)}`).join(" ")}"/></svg>`;
  }
  if (st.type.state === "in") {
    const now = x(elapsed(st.period || 1, st.displayClock));
    html += `<div class="fut" style="left:${now}%"></div><div class="now" style="left:${now}%"></div>`;
  }
  const colorOf = (id) => (id === home.team.id ? "var(--h)" : "var(--a)");
  const sideOf = (id) => (id === home.team.id ? "home" : "away");
  for (const e of data.scores) {
    if (!e.team) continue;
    const k = shapeKind(e.label);
    const team = e.team === home.team.id ? home.team : away.team;
    const icon = k === "td" ? tdBadge(team, colorOf(e.team)) : shapeSVG(k, colorOf(e.team));
    html += `<span class="ev ${k} ${sideOf(e.team)}" data-play="${esc(e.id)}" data-t="${e.t}" style="left:${x(e.t)}%">${icon}</span>`;
  }
  return html;
}

function scoreKey(ev) {
  return ev.competitions[0].competitors.map(c => c.score).join("-") + "|" + ev.status.type.state;
}
const prevScores = new Map(); // "eventId:teamId" -> score, to animate changes

// One shape per play type so they read without color:
// touchdown = team badge, field goal = goalpost, safety = "2".
function shapeKind(label) {
  return { TD: "td", FG: "fg", SF: "sf" }[label] || "sf";
}
function shapeSVG(kind, color, size) {
  const s = size ?? { td: 16, fg: 16, sf: 15 }[kind];
  const body = {
    // Football: brown oval with white laces.
    td: `<ellipse cx="8" cy="8" rx="7" ry="4.6" transform="rotate(-30 8 8)" fill="#8b4a22" stroke="#fff" stroke-width="1.2"/>
         <path d="M5.6 9.4L10.4 6.6M6.9 7.7l.9 1.5M8.2 7l.9 1.5" stroke="#fff" stroke-width="1" stroke-linecap="round"/>`,
    // Goalpost: crossbar, uprights and base, white casing under team color.
    fg: `<path d="M8 15V9M3 1.5V9h10V1.5" fill="none" stroke="#fff" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
         <path d="M8 15V9M3 1.5V9h10V1.5" fill="none" style="stroke:${color}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>`,
    // Safety: a "2" badge (worth two points).
    sf: `<circle cx="8" cy="8" r="7" style="fill:${color}" stroke="#fff" stroke-width="1.5"/>
         <text x="8" y="11.6" text-anchor="middle" font-size="10" font-weight="800" fill="#fff" font-family="system-ui, sans-serif">2</text>`,
  }[kind];
  return `<svg width="${s}" height="${s}" viewBox="0 0 16 16" aria-hidden="true">${body}</svg>`;
}
// Touchdown marker on the timeline: the scoring team's logo on a white badge
// ringed in team color.
function tdBadge(team, color) {
  const logo = team?.logo ? `<img src="${esc(team.logo)}" alt="" loading="lazy">` : "";
  return `<span class="tdb" style="--c:${color}">${logo}</span>`;
}
// ESPN ships a variant of each logo with an outline for dark backgrounds,
// which keeps navy-on-navy marks (Cowboys, Bears…) visible on their own color.
const darkLogo = (url) => String(url || "").replace("/teamlogos/nfl/500/", "/teamlogos/nfl/500-dark/");

async function getSummary(id, maxAge) {
  const hit = rawSummaries.get(id);
  if (hit && Date.now() - hit.at < maxAge) return hit.raw;
  const res = await fetch(API.replace("/scoreboard", "/summary") + "?event=" + id, { cache: "no-store" });
  if (!res.ok) throw new Error("ESPN returned " + res.status);
  const raw = await res.json();
  rawSummaries.set(id, { raw, at: Date.now() });
  return raw;
}

// Parse a summary and redraw every chart for that game that's on screen.
function ingest(ev, raw) {
  const data = parseSummary(raw);
  data.final = ev.status.type.state === "post";
  data.key = scoreKey(ev);
  data.at = Date.now();
  summaries.set(ev.id, data);
  for (const el of document.querySelectorAll(`.tl[data-id="${ev.id}"]`)) {
    const out = timeline(ev, data);
    const sig = hashStr(out);
    if (el.dataset.sig !== sig) { el.innerHTML = out; el.dataset.sig = sig; }
  }
  restoreScrub();
  return data;
}

async function loadTimelines(events) {
  await Promise.all(events.filter(e => e.status.type.state !== "pre").map(async (ev) => {
    const cached = summaries.get(ev.id);
    if (cached && cached.final) return;
    const key = scoreKey(ev);
    if (cached && cached.key === key && Date.now() - cached.at < 60000) return;
    try { ingest(ev, await getSummary(ev.id, 0)); }
    catch { /* timeline is a nice-to-have; leave the empty strip */ }
  }));
}

function hashStr(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0;
  return (h >>> 0).toString(36);
}

// Mini field for a live game. Away team defends the left end zone and drives
// right; home defends the right. ESPN's yardLine is the number on the field
// (0-50); possessionText ("BAL 47") says whose half it's in. We convert it to
// yards from the home goal line.
function fieldView(sit, away, home) {
  const [sideAbbr, num] = String(sit.possessionText || "").split(" ");
  const n = Number(num ?? sideAbbr);
  const line = !Number.isFinite(n) ? NaN
    : sideAbbr === home.team.abbreviation ? n
    : sideAbbr === away.team.abbreviation ? 100 - n
    : 50;
  const ball = sit.possession;
  const known = Number.isFinite(line) && (ball === home.team.id || ball === away.team.id);
  const pos = (yds) => 8 + 84 * ((100 - yds) / 100); // % across, inside end zones
  let marks = "";
  if (known) {
    const dir = ball === away.team.id ? 1 : -1;      // +1 = toward the right
    const ballX = pos(line);
    if (sit.distance && sit.down) {
      const fd = Math.max(0, Math.min(100, line - dir * sit.distance));
      const toX = pos(fd);
      marks += `<span class="gain" style="left:${Math.min(ballX, toX)}%;width:${Math.abs(toX - ballX)}%"></span>`;
      marks += `<span class="fd" style="left:${toX}%"></span>`;
    }
    marks += `<span class="fb ${dir > 0 ? "r" : "l"}" style="left:${ballX}%"></span>`;
  }
  const text = sit.downDistanceText || sit.possessionText || "";
  const last = sit.lastPlay?.text || "";
  return `<div class="field">
    <div class="pitch"><span class="ez a"></span><span class="ez h"></span>${[20, 40, 60, 80].map(y => `<span class="yl" style="left:${8 + 84 * y / 100}%"></span>`).join("")}<span class="yl fifty" style="left:50%"></span>${marks}</div>
    <div class="sit">${sit.isRedZone ? '<b class="rzt">Red zone</b>' : ""}${esc(text)}${last ? `<span class="last">${esc(last.trim())}</span>` : ""}</div>
  </div>`;
}

const hex = (v, fb) => (/^[0-9a-f]{6}$/i.test(v || "") ? "#" + v : fb);
const teamVars = (ev) => {
  const { home, away } = teamsOf(ev);
  return `--a:${hex(away.team.color, "#333")};--h:${hex(home.team.color, "#333")}`;
};

function gameCard(ev, hero = false) {
  const comp = ev.competitions[0];
  const st = ev.status;
  const state = st.type.state; // pre | in | post
  const { home, away } = teamsOf(ev);
  const decided = state === "post" && (home.winner || away.winner);

  const sit = state === "in" ? comp.situation : null;
  const side = (c, which) => {
    const t = c.team;
    const k = ev.id + ":" + t.id;
    const prev = prevScores.get(k);
    const bumped = !hero && prev != null && c.score != null && prev !== c.score;
    if (c.score != null && !hero) prevScores.set(k, c.score);
    const hasBall = sit && sit.possession === t.id;
    const tos = sit ? sit[which + "Timeouts"] : null;
    const logo = esc(darkLogo(t.logo));
    const rec = c.records?.find(r => r.type === "total")?.summary || c.records?.[0]?.summary || "";
    const sub = state === "pre" && rec ? `${t.shortDisplayName} · ${rec}` : t.shortDisplayName;
    return `<div class="side ${which}${decided && !c.winner ? " lost" : ""}${bumped ? " bump" : ""}">
      ${logo ? `<img class="logo" src="${logo}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">` : ""}
      <div class="id"><span class="ab">${esc(t.abbreviation || "")}${hasBall ? '<i class="ball" title="Has the ball"></i>' : ""}</span><span class="nm">${tos != null ? `<span class="tos" title="${tos} timeouts left">${[0,1,2].map(i => `<b class="${i < tos ? "on" : ""}"></b>`).join("")}</span>` : esc(sub || "")}</span></div>
      ${state === "pre" ? "" : `<span class="sc">${esc(c.score ?? "")}</span>`}
    </div>`;
  };

  const tv = [...new Set((comp.broadcasts || []).flatMap(b => b.names || []))].join(", ");
  let pill;
  if (state === "pre") {
    const t = comp.timeValid === false ? "TBD"
      : new Date(ev.date).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
    pill = `<div class="pill">${esc(t)}${tv ? `<small>${esc(tv)}</small>` : ""}</div>`;
  } else if (state === "in") {
    const clock = st.type.name === "STATUS_IN_PROGRESS" && st.period
      ? `${qLabel(st.period)} ${st.displayClock}`
      : st.type.shortDetail;
    pill = `<div class="pill live">${esc(clock)}${tv ? `<small>${esc(tv)}</small>` : ""}</div>`;
  } else {
    pill = `<div class="pill">${esc(st.type.shortDetail)}</div>`;
  }

  const field = sit ? fieldView(sit, away, home) : "";
  const tl = state === "pre" || hero ? ""
    : `<div class="tl" data-id="${esc(ev.id)}" tabindex="0" aria-label="Game timeline: use arrow keys to step through plays">${timeline(ev, summaries.get(ev.id))}</div>`;
  const body = `${side(away, "away")}${side(home, "home")}${pill}${field}${tl}`;
  const label = `${away.team.displayName} at ${home.team.displayName}`;
  return `<article class="game ${state === "post" ? "final" : state}${sit?.isRedZone ? " rz" : ""}" data-id="${esc(ev.id)}" data-sig="${hashStr(body)}" style="${teamVars(ev)}"${hero ? "" : ` tabindex="0" aria-label="${esc(label)}"`}>
    ${body}
  </article>`;
}

// Swap in new markup without blowing away the page: if the same games are on
// screen, only replace the tiles that changed. Scroll position never moves.
function patchMain(html) {
  const main = $("main");
  const next = document.createElement("div");
  next.innerHTML = html;
  const ids = (root) => [...root.querySelectorAll("article.game")].map(a => a.dataset.id).join(",");
  if (main.querySelector("article.game") && ids(main) === ids(next)) {
    for (const fresh of next.querySelectorAll("article.game")) {
      const old = main.querySelector(`article.game[data-id="${fresh.dataset.id}"]`);
      if (old && old.dataset.sig !== fresh.dataset.sig) {
        const hadFocus = old.contains(document.activeElement);
        old.replaceWith(fresh);
        if (hadFocus) fresh.focus({ preventScroll: true });
      }
    }
    main.querySelectorAll(".dayhead").forEach((el, i) => {
      const n = next.querySelectorAll(".dayhead")[i];
      if (n && el.outerHTML !== n.outerHTML) el.replaceWith(n);
    });
  } else {
    const y = window.scrollY;
    main.replaceChildren(...next.childNodes);
    window.scrollTo(0, y);
  }
}

function stamp(live) {
  $("updated").textContent = "Updated " + new Date().toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
  clearTimeout(timer);
  if (live) timer = setTimeout(() => loadWeek(true), 15000); // keep scores fresh during games
}

function showError(err) {
  $("main").innerHTML = `<div class="msg">Couldn't load the schedule (${esc(err.message)}).<br>Try refresh.</div>`;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// ---- Chart scrubbing ---------------------------------------------------------
// Hover (mouse), drag or tap (touch), or arrow keys (focus) on any timeline to
// read the play at that moment in a floating card.
const tip = document.createElement("div");
tip.className = "tip";
tip.hidden = true;
tip.setAttribute("role", "status");
document.body.appendChild(tip);

let scrub = null; // { el, id, big, play, quiet }

function chartCtx(el) {
  const id = el?.dataset.id, ev = currentEvents.get(id), data = summaries.get(id);
  if (!ev || !data?.plays?.length) return null;
  return { id, ev, data, total: totalSecs(ev, data) };
}

// Closest play to time t. Several plays can share a clock (TD, extra point,
// kickoff), so among near-ties prefer the one that mattered most.
function playNear(data, t) {
  let best = Infinity;
  for (const p of data.plays) best = Math.min(best, Math.abs(p.t - t));
  let pick = null, top = -1;
  for (const p of data.plays) {
    if (Math.abs(p.t - t) > best + 3) continue;
    const imp = (p.score ? 100 : 0) + (p.to ? 50 : 0) + Math.abs(p.dwp || 0) * 100;
    if (imp > top) { top = imp; pick = p; }
  }
  return pick;
}

function scrubAt(el, clientX, target) {
  const c = chartCtx(el);
  if (!c) return;
  let play = null;
  const mk = target?.closest?.(".ev[data-play]");
  if (mk && el.contains(mk)) {
    play = c.data.plays.find(p => p.id === mk.dataset.play) || playNear(c.data, Number(mk.dataset.t));
  }
  if (!play) {
    const r = el.getBoundingClientRect();
    const pct = ((clientX - r.left) / r.width) * 100;
    play = playNear(c.data, ((pct - 3) / 94) * c.total);
  }
  showScrub(el, c, play);
}

function showScrub(el, c, play, quiet = false) {
  if (!play) return hideScrub();
  if (scrub && scrub.el !== el) clearCursor(scrub.el);
  scrub = { el, id: c.id, big: el.classList.contains("big"), play, quiet };
  const x = xPct(play.t, c.total);
  let cur = el.querySelector(":scope > .cur");
  if (!cur) {
    cur = document.createElement("div");
    cur.className = "cur";
    cur.innerHTML = "<i></i>";
    el.appendChild(cur);
  }
  cur.style.left = x + "%";
  cur.firstChild.style.top = (play.wp ?? 0.5) * 100 + "%";
  el.classList.add("scrub");
  el.querySelectorAll(".ev.on").forEach(n => n.classList.remove("on"));
  el.querySelector(`.ev[data-play="${play.id}"]`)?.classList.add("on");
  document.querySelectorAll("[data-focus].on").forEach(n => n.classList.remove("on"));
  if (scrub.big) el.closest(".sheet-body")?.querySelectorAll(`[data-focus="${play.id}"]`).forEach(n => n.classList.add("on"));

  if (quiet) { tip.hidden = true; return; }
  tip.setAttribute("style", teamVars(c.ev));
  tip.innerHTML = tipHTML(c.ev, c.data, play);
  tip.hidden = false;
  const r = el.getBoundingClientRect();
  const w = tip.offsetWidth, h = tip.offsetHeight;
  const px = r.left + (r.width * x) / 100;
  const left = Math.max(8, Math.min(innerWidth - w - 8, px - w / 2));
  let top = r.top - h - 10;
  if (top < 8) top = r.bottom + 10;
  tip.style.left = left + "px";
  tip.style.top = top + "px";
}

function clearCursor(el) {
  el.querySelector(":scope > .cur")?.remove();
  el.classList.remove("scrub");
  el.querySelectorAll(".ev.on").forEach(n => n.classList.remove("on"));
}
function hideScrub() {
  if (scrub) clearCursor(scrub.el);
  document.querySelectorAll("[data-focus].on").forEach(n => n.classList.remove("on"));
  scrub = null;
  tip.hidden = true;
}
// After a refresh swaps a chart's markup, put the cursor back where it was.
function restoreScrub() {
  if (!scrub) return;
  let el = scrub.el;
  if (!el.isConnected || !el.querySelector(":scope > .cur")) {
    el = el.isConnected ? el : document.querySelector(`.tl${scrub.big ? ".big" : ":not(.big)"}[data-id="${scrub.id}"]`);
    const c = chartCtx(el);
    const play = c && c.data.plays.find(p => p.id === scrub.play.id);
    if (!play) return hideScrub();
    showScrub(el, c, play, scrub.quiet);
  }
}

function tipHTML(ev, data, p) {
  const { home, away } = teamsOf(ev);
  const off = p.team === home.team.id ? home.team : p.team === away.team.id ? away.team : null;
  const sc = p.score && data.scores.find(s => s.id === p.id);
  const scorer = sc && (sc.team === home.team.id ? "var(--h)" : "var(--a)");
  const tag = sc ? `<em class="tag" style="--c:${scorer}">${{ TD: "Touchdown", FG: "Field goal", SF: "Safety" }[sc.label] || "Score"}</em>`
    : p.to ? '<em class="tag to">Turnover</em>'
    : p.pen ? '<em class="tag pen">Flag</em>' : "";
  const hw = p.wp ?? 0.5, aw = 1 - hw;
  const pct = (v) => Math.round(v * 100);
  const mag = pct(Math.abs(p.dwp || 0));
  const gainer = p.dwp > 0 ? home.team : away.team;
  const swing = mag >= 1 ? `<span class="swing">▲ ${mag}% ${esc(gainer.abbreviation)}</span>` : "";
  return `<div class="th">${off ? `<img src="${esc(darkLogo(off.logo))}" alt=""><b>${esc(off.abbreviation)}</b>` : ""}<span class="clk">${qLabel(p.per)} · ${esc(p.clock)}</span>${tag}</div>
    ${p.dd ? `<div class="dd">${esc(p.dd)}</div>` : ""}
    <p>${esc(p.text)}</p>
    <div class="tf"><span>${esc(away.team.abbreviation)} <b>${p.a ?? ""}</b> &nbsp; ${esc(home.team.abbreviation)} <b>${p.h ?? ""}</b></span>${swing}</div>
    <div class="bar"><i style="width:${aw * 100}%;background:var(--a)"></i><i style="flex:1;background:var(--h)"></i></div>
    <div class="bl"><span>${esc(away.team.abbreviation)} <b>${pct(aw)}%</b></span><span>win odds</span><span><b>${pct(hw)}%</b> ${esc(home.team.abbreviation)}</span></div>`;
}

// Mouse and pen: the card follows the pointer.
document.addEventListener("pointermove", (e) => {
  if (e.pointerType === "touch") return onTouchMove(e);
  const el = e.target.closest?.(".tl");
  if (el) return scrubAt(el, e.clientX, e.target);
  if (scrub && !e.target.closest?.("[data-focus]")) hideScrub();
});
document.documentElement.addEventListener("mouseleave", () => { if (scrub && !scrub.quiet) hideScrub(); });

// Touch: tap a chart to read that moment, or drag along it to scrub.
// Vertical swipes still scroll the page (touch-action: pan-y), and a short
// delay keeps the card from flashing when a scroll starts on a chart.
let touch = null, lastPointer = "mouse";
document.addEventListener("pointerdown", (e) => {
  lastPointer = e.pointerType;
  if (e.pointerType !== "touch") return;
  const el = e.target.closest?.(".tl");
  if (!el) { if (scrub) hideScrub(); return; }
  touch = { el, x: e.clientX, y: e.clientY, target: e.target, live: false };
  touch.timer = setTimeout(() => { if (touch) { touch.live = true; scrubAt(el, touch.x, touch.target); } }, 140);
});
function onTouchMove(e) {
  if (!touch) return;
  if (!touch.live && Math.abs(e.clientX - touch.x) > 4 && Math.abs(e.clientX - touch.x) > Math.abs(e.clientY - touch.y)) {
    clearTimeout(touch.timer);
    touch.live = true;
  }
  if (touch.live) scrubAt(touch.el, e.clientX, null);
}
document.addEventListener("pointerup", (e) => {
  if (e.pointerType !== "touch" || !touch) return;
  clearTimeout(touch.timer);
  if (!touch.live) scrubAt(touch.el, touch.x, touch.target);
  touch = null;
});
document.addEventListener("pointercancel", (e) => {
  if (e.pointerType !== "touch" || !touch) return;
  clearTimeout(touch.timer);
  touch = null;
  hideScrub();
});
// The card is pinned to a spot on screen, so it goes away once things scroll.
addEventListener("scroll", () => { if (scrub && !scrub.quiet && !touch) hideScrub(); }, { capture: true, passive: true });
addEventListener("resize", () => { if (scrub) hideScrub(); });

// Keyboard: arrows step play by play, Shift+arrows jump between scores.
document.addEventListener("focusout", (e) => {
  if (scrub && e.target === scrub.el && !scrub.el.contains(e.relatedTarget)) hideScrub();
});
function stepChart(el, dir, scoresOnly) {
  const c = chartCtx(el);
  if (!c) return;
  const ps = c.data.plays;
  let i = scrub?.el === el ? ps.findIndex(p => p.id === scrub.play.id) : (dir > 0 ? -1 : ps.length);
  do i += dir; while (scoresOnly && ps[i] && !ps[i].score);
  i = Math.max(0, Math.min(ps.length - 1, i));
  showScrub(el, c, ps[i]);
}

// Plays listed in the details (scoring, big swings) light up the big chart.
document.addEventListener("pointerover", (e) => {
  if (e.pointerType === "touch") return;
  const it = e.target.closest?.("[data-focus]");
  if (!it) return;
  const el = it.closest(".sheet-body")?.querySelector(".tl.big");
  const c = chartCtx(el);
  const play = c?.data.plays.find(p => p.id === it.dataset.focus);
  if (play) showScrub(el, c, play, true);
});
document.addEventListener("pointerout", (e) => {
  const it = e.target.closest?.("[data-focus]");
  if (it && !it.contains(e.relatedTarget) && scrub?.quiet && !e.relatedTarget?.closest?.("[data-focus]")) hideScrub();
});

// ---- Game details --------------------------------------------------------------
// Phones get a draggable bottom sheet (Cupertino Pane), tablets a centered
// modal, and desktops a panel docked to the right so the list stays usable.
let sheetId = null;
let pane = null;          // CupertinoPane instance while open on mobile
let paneBody = null;      // its content element

function sheetBody() { return pane ? paneBody : $("sheetBody"); }
function sheetScroller() { return pane ? paneBody : $("sheet").querySelector(".panel"); }

function openGame(id) {
  if (location.hash === "#g" + id) return showSheet(id);
  // Switching games while one is open replaces the entry, so Back still closes.
  if (sheetId) { history.replaceState(null, "", "#g" + id); showSheet(id); }
  else location.hash = "g" + id;
}
function closeSheet() {
  if (location.hash.startsWith("#g")) history.back(); else hideSheet();
}
function hideSheet() {
  const was = sheetId;
  sheetId = null;
  hideScrub();
  $("sheet").hidden = true;
  document.body.classList.remove("locked", "docked");
  if (pane) {
    const p = pane;
    pane = null;
    if (p.isPanePresented()) p.destroy({ animate: true });
  }
  markSelected();
  if (was) document.querySelector(`#main article.game[data-id="${was}"]`)?.focus({ preventScroll: true });
}
function onHash() {
  const m = /^#g(\d+)$/.exec(location.hash);
  if (m) showSheet(m[1]); else hideSheet();
}
function markSelected() {
  document.querySelectorAll("#main article.game").forEach(a => a.classList.toggle("sel", a.dataset.id === sheetId));
}

function mountSheet() {
  if (!(mobileQuery.matches && window.CupertinoPane)) {
    const docked = dockQuery.matches;
    $("sheet").hidden = false;
    document.body.classList.toggle("docked", docked);
    document.body.classList.toggle("locked", !docked);
    $("sheet").querySelector(".panel").setAttribute("aria-modal", String(!docked));
    $("sheet").querySelector(".panel").scrollTop = 0;
    return;
  }
  if (pane) { paneBody.scrollTop = 0; return; }
  const el = document.createElement("div");
  el.className = "pane-sheet";
  el.innerHTML = '<button class="x" aria-label="Close">×</button><div class="sheet-body" overflow-y></div>';
  document.body.appendChild(el);
  paneBody = el.querySelector(".sheet-body");
  el.querySelector(".x").addEventListener("click", closeSheet);
  pane = new CupertinoPane(el, {
    parentElement: "body",
    backdrop: true,
    backdropOpacity: 0.55,
    bottomClose: true,
    fastSwipeClose: true,
    buttonDestroy: false,
    showDraggable: true,
    draggableOver: true,
    breaks: {
      top: { enabled: true, height: window.innerHeight - 28, bounce: true },
      middle: { enabled: false },
      bottom: { enabled: false },
    },
    initialBreak: "top",
    events: {
      onBackdropTap: () => closeSheet(),
      onDidDismiss: () => {
        // Swiped away: drop our state and the #g hash, then clean up the node.
        const wasOpen = pane;
        pane = null;
        el.remove();
        hideScrub();
        if (wasOpen && sheetId) { sheetId = null; if (location.hash.startsWith("#g")) history.back(); }
      },
    },
  });
  pane.present({ animate: true });
}

function setSheet(html) {
  const body = sheetBody();
  const sig = hashStr(html);
  if (body.dataset.sig === sig) return;
  const scroller = sheetScroller(), y = scroller.scrollTop;
  body.innerHTML = html;
  body.dataset.sig = sig;
  scroller.scrollTop = y;
  restoreScrub();
}

async function showSheet(id) {
  const ev = currentEvents.get(id);
  const switching = sheetId !== id;
  if (switching) hideScrub();
  sheetId = id;
  mountSheet();
  markSelected();
  if (switching) sheetBody().dataset.sig = "";
  if (!ev) { setSheet('<div class="msg">Game not in this week.</div>'); return; }
  if (document.body.classList.contains("docked")) {
    document.querySelector(`#main article.game[data-id="${id}"]`)?.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
  setSheet(detailHTML(ev, rawSummaries.get(id)?.raw));
  if (switching) sheetScroller().scrollTop = 0;
  try {
    const raw = await getSummary(id, ev.status.type.state === "post" ? Infinity : 15000);
    const now = currentEvents.get(id) || ev;
    ingest(now, raw);
    if (sheetId === id) setSheet(detailHTML(now, raw));
  } catch (err) { /* header still shows; sections need the summary */ }
}

// Called after each scoreboard refresh: keep an open live game current.
async function refreshSheet() {
  if (!sheetId) return;
  const id = sheetId, ev = currentEvents.get(id);
  if (!ev) return;
  let raw = rawSummaries.get(id)?.raw;
  if (ev.status.type.state === "in") { try { raw = await getSummary(id, 15000); ingest(ev, raw); } catch {} }
  if (sheetId === id) setSheet(detailHTML(ev, raw));
}

function detailHTML(ev, raw) {
  const comp = ev.competitions[0];
  const st = ev.status, state = st.type.state;
  const { home, away } = teamsOf(ev);
  const teamById = (id) => (id === home.team.id ? home : away);
  const colorOf = (id) => (id === home.team.id ? "var(--h)" : "var(--a)");
  const vars = teamVars(ev);
  let html = `<div class="hero">${gameCard(ev, true)}</div>`;

  // Facts line
  const date = new Date(ev.date).toLocaleString(undefined, { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  const venue = raw?.gameInfo?.venue || comp.venue;
  const w = raw?.gameInfo?.weather;
  const odds = raw?.pickcenter?.[0];
  const tv = [...new Set((comp.broadcasts || []).flatMap(b => b.names || []))].join(", ");
  const facts = [
    ["Kickoff", date],
    venue && ["Stadium", [venue.fullName, venue.address?.city].filter(Boolean).join(", ")],
    tv && ["TV", tv],
    w?.temperature != null && ["Weather", `${w.temperature}°${w.conditionId && isNaN(w.conditionId) ? " · " + w.conditionId : ""}`],
    odds?.details && ["Line", `${odds.details}${odds.overUnder ? " · O/U " + odds.overUnder : ""}`],
  ].filter(Boolean);
  html += `<dl class="facts">${facts.map(([k, v]) => `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl>`;

  // Current drive (live)
  const cur = state === "in" ? raw?.drives?.current : null;
  if (cur?.plays?.length) {
    const plays = cur.plays.slice(-4).reverse();
    html += `<section class="sec"><h3>Current drive <span>${esc(cur.team?.abbreviation || "")} · ${esc(cur.description || "")}</span></h3>
      <ol class="plays">${plays.map(p => `<li><b>${esc(p.start?.shortDownDistanceText || p.type?.text || "")}</b>${esc(p.text || "")}</li>`).join("")}</ol></section>`;
  }

  // Game flow: the big, scrubbable win probability chart.
  const data = raw ? summaries.get(ev.id) : null;
  if (state !== "pre" && data?.plays?.length) {
    const lab = (c) => `<span><img src="${esc(c.team.logo || "")}" alt="">${esc(c.team.abbreviation)}</span>`;
    const hint = matchMedia("(hover: hover)").matches ? "hover to replay any snap" : "tap or drag to replay any snap";
    html += `<section class="sec"><h3>Game flow <span>Win odds · ${hint}</span></h3>
      <div class="flow"><div class="ylab">${lab(away)}<em>50%</em>${lab(home)}</div>
      <div class="tl big" data-id="${esc(ev.id)}" tabindex="0" aria-label="Win probability chart: use arrow keys to step through plays">${timeline(ev, data)}</div></div></section>`;

    // Biggest swings in win probability.
    const swings = data.plays.filter(p => Math.abs(p.dwp) >= 0.04)
      .sort((a, b) => Math.abs(b.dwp) - Math.abs(a.dwp)).slice(0, 5);
    if (swings.length) {
      html += `<section class="sec"><h3>Biggest swings</h3><ol class="swings">${swings.map(p => {
        const g = p.dwp > 0 ? home : away;
        return `<li data-focus="${esc(p.id)}" style="--c:${colorOf(g.team.id)}"><img src="${esc(g.team.logo || "")}" alt="">
          <div><b>${esc(p.type)}</b><span class="clk">${qLabel(p.per)} · ${esc(p.clock)}</span><p>${esc(p.text)}</p></div>
          <span class="amt">+${Math.round(Math.abs(p.dwp) * 100)}%</span></li>`;
      }).join("")}</ol></section>`;
    }
  }

  // Line score
  const ls = (c) => (c.linescores || []).map(l => l.value ?? l.displayValue);
  const n = Math.max(4, ls(away).length, ls(home).length);
  if (state !== "pre") {
    const head = Array.from({ length: n }, (_, i) => `<th>${i < 4 ? i + 1 : "OT"}</th>`).join("");
    const row = (c) => `<tr><td class="tm"><img src="${esc(c.team.logo || "")}" alt="">${esc(c.team.abbreviation)}</td>${Array.from({ length: n }, (_, i) => `<td>${ls(c)[i] ?? "–"}</td>`).join("")}<td class="tot">${esc(c.score ?? "")}</td></tr>`;
    html += `<section class="sec"><table class="linescore"><thead><tr><th></th>${head}<th>T</th></tr></thead><tbody>${row(away)}${row(home)}</tbody></table></section>`;
  }

  if (!raw) return `<div style="${vars}">${html}${state === "pre" ? "" : '<div class="msg">Loading game details…</div>'}</div>`;

  // Scoring plays
  const sp = raw.scoringPlays || [];
  if (sp.length) {
    let q = 0, items = "";
    for (const p of sp) {
      const per = p.period?.number || 1;
      if (per !== q) { q = per; items += `<li class="qh">${per <= 4 ? "Quarter " + per : "Overtime"}</li>`; }
      const t = teamById(p.team?.id);
      items += `<li class="sp" data-focus="${esc(p.id)}" style="--c:${colorOf(p.team?.id)}">
        <img src="${esc(t.team.logo || "")}" alt="">
        <div>${shapeSVG(shapeKind(p.scoringType?.abbreviation || p.type?.abbreviation), colorOf(p.team?.id), 12).replace("<svg", '<svg class="spk"')} <b>${esc(p.type?.text || p.scoringType?.displayName || "")}</b> <span class="clk">${esc(p.clock?.displayValue || "")}</span><p>${esc(p.text || "")}</p></div>
        <span class="run">${p.awayScore}–${p.homeScore}</span></li>`;
    }
    html += `<section class="sec"><h3>Scoring</h3><ul class="scoring">${items}</ul></section>`;
  }

  // Team stats
  const bt = raw.boxscore?.teams || [];
  const statsOf = (c) => bt.find(t => t.team?.id === c.team.id)?.statistics || [];
  const A = statsOf(away), H = statsOf(home);
  if (A.length && H.length) {
    const pick = ["totalYards", "netPassingYards", "rushingYards", "firstDowns", "thirdDownEff", "redZoneAttempts", "turnovers", "totalPenaltiesYards", "sacksYardsLost", "possessionTime"];
    const num = (v) => (String(v).includes(":") ? secs(v) : parseFloat(v) || 0);
    const rows = pick.map(name => {
      const a = A.find(x => x.name === name), h = H.find(x => x.name === name);
      if (!a || !h) return "";
      const av = num(a.displayValue), hv = num(h.displayValue), tot = av + hv || 1;
      return `<div class="st"><span class="v">${esc(a.displayValue)}</span><span class="lbl">${esc(a.label)}</span><span class="v">${esc(h.displayValue)}</span>
        <div class="bar"><i style="width:${(av / tot) * 100}%;background:var(--a)"></i><i style="width:${(hv / tot) * 100}%;background:var(--h)"></i></div></div>`;
    }).join("");
    if (rows.trim()) html += `<section class="sec"><h3>Team stats <span>${esc(away.team.abbreviation)} vs ${esc(home.team.abbreviation)}</span></h3><div class="stats">${rows}</div></section>`;
  }

  // Leaders
  const leaders = raw.leaders || [];
  if (leaders.length) {
    const cats = ["passingYards", "rushingYards", "receivingYards"];
    const block = (c) => {
      const L = leaders.find(l => l.team?.id === c.team.id)?.leaders || [];
      return cats.map(cat => {
        const top = L.find(x => x.name === cat)?.leaders?.[0];
        if (!top) return "";
        const img = top.athlete?.headshot?.href;
        return `<li>${img ? `<img src="${esc(img)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">` : '<span class="ph"></span>'}
          <div><b>${esc(top.athlete?.shortName || "")}</b><span>${esc(top.displayValue || "")}</span></div></li>`;
      }).join("");
    };
    html += `<section class="sec"><h3>${state === "pre" ? "Season leaders" : "Leaders"}</h3><div class="leaders">
      <div><h4 style="--c:var(--a)">${esc(away.team.shortDisplayName)}</h4><ul>${block(away)}</ul></div>
      <div><h4 style="--c:var(--h)">${esc(home.team.shortDisplayName)}</h4><ul>${block(home)}</ul></div></div></section>`;
  }
  return `<div style="${vars}">${html}</div>`;
}

// ---- Wiring ----------------------------------------------------------------------
$("main").addEventListener("click", (e) => {
  // On touch, taps on a chart read the play instead of opening the game.
  if (lastPointer === "touch" && e.target.closest(".tl")) return;
  const g = e.target.closest("article.game");
  if (g) openGame(g.dataset.id);
});
$("sortbar").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-sort]");
  if (!b) return;
  sortMode = b.dataset.sort;
  try { localStorage.setItem("sort", sortMode); } catch {}
  loadWeek(true);
});
$("sheet").addEventListener("click", (e) => { if (e.target.closest("[data-close]")) closeSheet(); });

// Next/previous game in on-screen order, for J/K.
function stepGame(dir) {
  const tiles = [...document.querySelectorAll("#main article.game")];
  if (!tiles.length) return;
  const at = tiles.findIndex(t => t.dataset.id === (sheetId ?? document.activeElement?.closest?.("article.game")?.dataset.id));
  const next = tiles[Math.max(0, Math.min(tiles.length - 1, at < 0 ? 0 : at + dir))];
  if (sheetId && document.body.classList.contains("docked")) openGame(next.dataset.id);
  else { next.focus(); next.scrollIntoView({ block: "nearest", behavior: "smooth" }); }
}

document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const chart = e.target.closest?.(".tl");
  if (chart && (e.key === "ArrowLeft" || e.key === "ArrowRight")) {
    e.preventDefault();
    return stepChart(chart, e.key === "ArrowRight" ? 1 : -1, e.shiftKey);
  }
  if (e.key === "Escape") {
    if (scrub) return hideScrub();
    if (sheetId) return closeSheet();
  }
  const tile = e.target.closest?.("#main article.game");
  if (tile && e.target === tile && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); return openGame(tile.dataset.id); }
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  if (e.key === "j" || e.key === "k") return stepGame(e.key === "j" ? 1 : -1);
  const modal = sheetId && !document.body.classList.contains("docked");
  if (!modal && !chart && e.key === "ArrowLeft" && idx > 0) { idx--; loadWeek(); }
  if (!modal && !chart && e.key === "ArrowRight" && idx < weeks.length - 1) { idx++; loadWeek(); }
});
window.addEventListener("hashchange", onHash);

// Switching between docked and modal layouts while a game is open.
dockQuery.addEventListener("change", () => { if (sheetId && !pane) mountSheet(); });

// Hairline under the sticky bar once the page scrolls.
addEventListener("scroll", () => $("top").classList.toggle("stuck", scrollY > 4), { passive: true });

$("legend").innerHTML =
  `<span>${tdBadge({ logo: "https://a.espncdn.com/i/teamlogos/leagues/500/nfl.png" }, "var(--muted)")}Touchdown</span>` +
  `<span>${shapeSVG("fg", "var(--muted)", 13)}Field goal</span>` +
  `<span>${shapeSVG("sf", "var(--muted)", 13)}Safety</span><span>— win odds</span>` +
  `<span class="hint mouse">Hover a timeline to replay each play</span><span class="hint touch">Tap or drag a timeline to replay each play</span>`;

$("prev").onclick = () => { if (idx > 0) { idx--; loadWeek(); } };
$("next").onclick = () => { if (idx < weeks.length - 1) { idx++; loadWeek(); } };
$("refresh").onclick = () => (idx >= 0 ? loadWeek(true) : init());
document.addEventListener("visibilitychange", () => { if (!document.hidden && idx >= 0) loadWeek(true); });

init().then(onHash);
</script>
</body>
</html>
