<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NFL Schedule</title>
<meta name="description" content="Who plays tonight, tomorrow, and the rest of the week.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏈</text></svg>">
<style>
  :root {
    --bg: #ffffff;
    --text: #111111;
    --muted: #8a8a8a;
    --faint: #b8b8b8;
    --line: #ececec;
    --live: #e5484d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a0a0a;
      --text: #ededed;
      --muted: #7a7a7a;
      --faint: #4a4a4a;
      --line: #1c1c1c;
      --live: #ff6369;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.45 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    font-variant-numeric: tabular-nums;
  }
  .wrap { max-width: 520px; margin: 0 auto; padding: 40px 16px 64px; }

  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .weeklabel { font-size: 15px; font-weight: 600; }
  .weeklabel small { margin-left: 8px; color: var(--muted); font-weight: 400; }
  .weeknav { display: flex; gap: 2px; }
  .weeknav button {
    appearance: none; border: 0; background: none; color: var(--muted);
    font: inherit; font-size: 18px; width: 32px; height: 32px; cursor: pointer; border-radius: 6px;
  }
  .weeknav button:hover:not(:disabled) { color: var(--text); }
  .weeknav button:disabled { color: var(--faint); opacity: .4; cursor: default; }

  .day { margin-top: 32px; }
  .dayhead { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .dayhead.now { color: var(--text); font-weight: 600; }

  .games { display: grid; gap: 10px; margin-top: 12px; }

  /* A matchup tile: away color on the left, home color on the right,
     split on a diagonal, with oversized logo watermarks bleeding off the edges. */
  .game {
    --a: #333; --h: #333;
    position: relative; isolation: isolate; overflow: hidden;
    display: grid; grid-template-columns: 1fr 1fr; align-items: stretch;
    min-height: 112px; border-radius: 18px; color: #fff;
    background:
      linear-gradient(180deg, rgba(255,255,255,.10), rgba(0,0,0,.18)),
      linear-gradient(102deg, var(--a) calc(50% - .5px), var(--h) calc(50% + .5px));
  }
  .side { position: relative; display: flex; align-items: center; gap: 10px; padding: 34px 16px 22px; min-width: 0; }
  .side.home { flex-direction: row-reverse; text-align: right; }
  .side .mark {
    position: absolute; z-index: -1; width: 150px; height: 150px; object-fit: contain;
    top: 50%; opacity: .16; filter: brightness(0) invert(1); pointer-events: none;
  }
  .side.away .mark { left: -38px; transform: translateY(-50%) rotate(-10deg); }
  .side.home .mark { right: -38px; transform: translateY(-50%) rotate(10deg); }
  .side .logo { flex: none; width: 40px; height: 40px; object-fit: contain; filter: drop-shadow(0 2px 4px rgba(0,0,0,.35)); }
  .side .id { min-width: 0; flex: 1; display: grid; }
  .side .ab { font-size: 22px; font-weight: 800; letter-spacing: .02em; line-height: 1.05; }
  .side .nm { font-size: 12px; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .side .sc { flex: none; font-size: 32px; font-weight: 800; line-height: 1; margin: 0 14px; text-shadow: 0 2px 10px rgba(0,0,0,.25); }
  .side.away .sc { margin-left: 0; }
  .side.home .sc { margin-right: 0; }
  /* Losing side of a final fades back. */
  .final .side.lost .logo, .final .side.lost .id, .final .side.lost .sc { opacity: .5; }

  /* Status tag hangs from the top of the seam. */
  .pill {
    position: absolute; left: 50%; top: 10px; transform: translateX(-50%); z-index: 3;
    background: var(--bg); color: var(--text); border-radius: 999px;
    padding: 4px 10px; line-height: 1.2; white-space: nowrap;
    box-shadow: 0 3px 10px rgba(0,0,0,.25); font-size: 11px; font-weight: 700; letter-spacing: .02em;
  }
  .pill small { font-size: 11px; font-weight: 600; color: var(--muted); margin-left: 4px; }
  .pill small::before { content: "· "; }
  .pill.live { background: var(--live); color: #fff; }
  .pill.live small { color: rgba(255,255,255,.85); }
  .pill.live::before {
    content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: #fff; margin-right: 6px; vertical-align: 1px; animation: pulse 1.4s infinite;
  }
  @keyframes pulse { 50% { opacity: .2; } }


  /* Game timeline: a strip across the bottom of the tile. Away events sit
     above the midline, home events below; the white line is win probability. */
  .tl {
    grid-column: 1 / -1; position: relative; height: 46px; margin: 0 12px 12px;
    border-radius: 10px; background: rgba(0,0,0,.28); overflow: hidden;
  }
  .tl .q { position: absolute; top: 0; bottom: 0; border-left: 1px solid rgba(255,255,255,.12); }
  .tl .q span { position: absolute; top: 3px; left: 4px; font-size: 9px; font-weight: 700; color: rgba(255,255,255,.35); }
  .tl .mid { position: absolute; left: 0; right: 0; top: 50%; border-top: 1px dashed rgba(255,255,255,.15); }
  .tl svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .tl .wp { fill: none; stroke: rgba(255,255,255,.75); stroke-width: 1.5; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
  .tl .fut { position: absolute; top: 0; bottom: 0; right: 0; background: rgba(0,0,0,.30); }
  .tl .now { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: #fff; box-shadow: 0 0 6px rgba(255,255,255,.8); }
  .tl .ev {
    position: absolute; transform: translate(-50%, -50%); z-index: 1;
    width: 8px; height: 8px; border-radius: 50%; background: var(--c);
    box-shadow: 0 0 0 1.5px #fff, 0 1px 3px rgba(0,0,0,.4);
  }
  .tl .ev.td { width: 12px; height: 12px; z-index: 2; }
  .tl .ev.to {
    width: 8px; height: 8px; border-radius: 1px; background: #fff;
    box-shadow: 0 0 0 1.5px var(--c), 0 1px 3px rgba(0,0,0,.4);
    transform: translate(-50%, -50%) rotate(45deg);
  }
  .tl .ev.away { top: 28%; }
  .tl .ev.home { top: 72%; }

  .legend { display: flex; gap: 14px; font-size: 11px; color: var(--muted); margin-top: 6px; }
  .legend i { display: inline-block; vertical-align: middle; margin-right: 5px; border-radius: 50%; background: var(--muted); }
  .legend .l-td { width: 10px; height: 10px; }
  .legend .l-fg { width: 7px; height: 7px; }
  .legend .l-to { width: 7px; height: 7px; border-radius: 1px; background: none; border: 1.5px solid var(--muted); transform: rotate(45deg); }
  .game.has-tl .side { padding-bottom: 12px; }

  /* Live game extras */
  .ball {
    display: inline-block; width: 12px; height: 8px; margin-left: 6px; vertical-align: 4px;
    background: #8b4a22; border-radius: 50%; box-shadow: 0 0 0 1.5px #fff;
    position: relative;
  }
  .ball::after { content: ""; position: absolute; left: 3px; right: 3px; top: 3.5px; height: 1px; background: #fff; }
  .tos { display: inline-flex; gap: 3px; vertical-align: middle; }
  .tos b { width: 10px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.25); }
  .tos b.on { background: #fff; }

  .field { grid-column: 1 / -1; margin: 0 12px 8px; }
  .pitch {
    position: relative; height: 22px; border-radius: 6px; overflow: hidden;
    background: rgba(0,0,0,.28);
  }
  .pitch .ez { position: absolute; top: 0; bottom: 0; width: 8%; }
  .pitch .ez.a { left: 0; background: color-mix(in srgb, var(--a) 80%, #000); }
  .pitch .ez.h { right: 0; background: color-mix(in srgb, var(--h) 80%, #000); }
  .pitch .yl { position: absolute; top: 0; bottom: 0; border-left: 1px solid rgba(255,255,255,.14); }
  .pitch .yl.fifty { border-left-color: rgba(255,255,255,.3); }
  .pitch .gain { position: absolute; top: 4px; bottom: 4px; background: rgba(255,255,255,.18); }
  .pitch .fd { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: #ffd400; box-shadow: 0 0 6px #ffd400; }
  .pitch .fb {
    position: absolute; top: 50%; width: 14px; height: 9px; margin: -4.5px 0 0 -7px; z-index: 1;
    background: #8b4a22; border-radius: 50%; box-shadow: 0 0 0 1.5px #fff, 0 0 10px rgba(255,255,255,.6);
  }
  .pitch .fb::after { content: ""; position: absolute; top: 50%; border: 4px solid transparent; margin-top: -4px; }
  .pitch .fb.r::after { left: 100%; margin-left: 3px; border-left-color: #fff; }
  .pitch .fb.l::after { right: 100%; margin-right: 3px; border-right-color: #fff; }
  .sit { margin-top: 6px; font-size: 12px; font-weight: 700; display: flex; gap: 8px; align-items: baseline; min-width: 0; }
  .sit .last { font-weight: 400; opacity: .75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
  .rzt { background: var(--live); color: #fff; font-size: 10px; text-transform: uppercase; letter-spacing: .05em; padding: 2px 6px; border-radius: 4px; flex: none; }
  .game.rz { box-shadow: inset 0 0 0 2px var(--live), 0 0 24px color-mix(in srgb, var(--live) 35%, transparent); }

  /* Score change: the number pops and its side flashes. */
  .side.bump .sc { animation: pop 1.2s ease-out; }
  .side.bump::before {
    content: ""; position: absolute; inset: 0; z-index: -1; background: #fff; opacity: 0;
    animation: flash 1.6s ease-out;
  }
  @keyframes pop { 0% { transform: scale(1); } 15% { transform: scale(1.45); } 100% { transform: scale(1); } }
  @keyframes flash { 0% { opacity: .35; } 100% { opacity: 0; } }

  @media (max-width: 600px) {
    .games { margin: 12px -16px 0; gap: 6px; }
    .game { border-radius: 0; }
    .tl { margin: 0 10px 10px; }
  }

  @media (max-width: 400px) {
    .side { padding: 34px 12px 20px; gap: 8px; }
    .side .logo { width: 30px; height: 30px; }
    .side .ab { font-size: 19px; }
    .side .sc { font-size: 28px; margin: 0 10px; }
  }

  .byes { margin-top: 32px; color: var(--muted); font-size: 12px; }
  .msg { color: var(--muted); padding: 48px 0; font-size: 14px; }
  footer { margin-top: 40px; color: var(--faint); font-size: 12px; }
  footer button { background: none; border: 0; padding: 0; color: inherit; cursor: pointer; font: inherit; }
  footer button:hover { color: var(--text); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="weeklabel" id="weeklabel">…</div>
    <div class="weeknav">
      <button id="prev" aria-label="Previous week">←</button>
      <button id="next" aria-label="Next week">→</button>
    </div>
  </header>
  <div class="legend" aria-hidden="true"><span><i class="l-td"></i>Touchdown</span><span><i class="l-fg"></i>FG / safety</span><span><i class="l-to"></i>Turnover</span><span>— win odds</span></div>
  <main id="main"><div class="msg">Loading games…</div></main>
  <footer>
    <button id="refresh"><span id="updated"></span></button>
  </footer>
</div>

<script>
const API = "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard";
const $ = (id) => document.getElementById(id);

let weeks = [];        // [{seasontype, week, label, detail, start, end}]
let idx = -1;          // index into weeks currently shown
let year = null;
let timer = null;
const summaries = new Map(); // event id -> parsed timeline data

function buildWeeks(league) {
  const out = [];
  for (const group of league.calendar || []) {
    if (!group.entries || group.value === "1") continue; // skip preseason + offseason
    for (const e of group.entries) {
      out.push({
        seasontype: group.value, week: e.value,
        label: e.label, detail: e.detail,
        start: new Date(e.startDate), end: new Date(e.endDate),
      });
    }
  }
  return out;
}

async function fetchBoard(params) {
  const qs = new URLSearchParams(params).toString();
  const res = await fetch(API + (qs ? "?" + qs : ""), { cache: "no-store" });
  if (!res.ok) throw new Error("ESPN returned " + res.status);
  return res.json();
}

async function init() {
  try {
    const data = await fetchBoard({});
    const league = data.leagues[0];
    year = league.season.year;
    weeks = buildWeeks(league);
    const st = String(data.season?.type ?? league.season.type.type);
    const wk = String(data.week?.number);
    idx = weeks.findIndex(w => w.seasontype === st && w.week === wk);
    if (idx === -1) {
      // Offseason / preseason: pick the next upcoming week, else the last one.
      const now = new Date();
      idx = weeks.findIndex(w => w.end > now);
      if (idx === -1) idx = weeks.length - 1;
      await loadWeek();
    } else {
      render(data);
    }
  } catch (err) {
    showError(err);
  }
}

let loadSeq = 0;
// silent = background refresh: keep what's on screen and patch it in place.
async function loadWeek(silent = false) {
  const w = weeks[idx];
  const seq = ++loadSeq;
  updateNav();
  if (!silent) $("main").innerHTML = '<div class="msg">Loading games…</div>';
  try {
    const data = await fetchBoard({ seasontype: w.seasontype, week: w.week, dates: year });
    if (seq !== loadSeq) return; // user moved to another week meanwhile
    render(data);
  } catch (err) {
    if (!silent) showError(err);
    else stamp(true); // try again on the next tick
  }
}

function updateNav() {
  const w = weeks[idx];
  if (!w) return;
  $("weeklabel").innerHTML = `${esc(w.label)}<small>${esc(w.detail || "")}</small>`;
  $("prev").disabled = idx <= 0;
  $("next").disabled = idx >= weeks.length - 1;
}

function dayKey(d) { return d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate(); }

function dayLabel(d) {
  const today = new Date();
  const tomorrow = new Date(today); tomorrow.setDate(today.getDate() + 1);
  const yesterday = new Date(today); yesterday.setDate(today.getDate() - 1);
  const k = dayKey(d);
  if (k === dayKey(today)) return { name: "Today", now: true };
  if (k === dayKey(tomorrow)) return { name: "Tomorrow", now: false };
  if (k === dayKey(yesterday)) return { name: "Yesterday", now: false };
  return { name: d.toLocaleDateString(undefined, { weekday: "long" }), now: false };
}

function render(data) {
  updateNav();
  const events = (data.events || []).slice().sort((a, b) => new Date(a.date) - new Date(b.date));
  if (!events.length) {
    $("main").innerHTML = '<div class="msg">No games scheduled this week.</div>';
    stamp(false);
    return;
  }

  const groups = new Map();
  for (const ev of events) {
    const d = new Date(ev.date);
    const k = dayKey(d);
    if (!groups.has(k)) groups.set(k, { date: d, games: [] });
    groups.get(k).games.push(ev);
  }

  let html = "";
  for (const { date, games } of groups.values()) {
    const lbl = dayLabel(date);
    const dateStr = date.toLocaleDateString(undefined, { month: "short", day: "numeric" });
    html += `<section class="day"><div class="dayhead${lbl.now ? " now" : ""}">${lbl.name} · ${dateStr}</div>`;
    html += `<div class="games">${games.map(gameCard).join("")}</div>`;
    html += `</section>`;
  }

  const byes = data.week?.teamsOnBye || [];
  if (byes.length) {
    html += `<div class="byes">Bye — ${byes.map(t => esc(t.shortDisplayName || t.displayName)).join(", ")}</div>`;
  }

  patchMain(html);
  loadTimelines(events);
  const anyLive = events.some(e => e.status?.type?.state === "in");
  const startsSoon = events.some(e => e.status?.type?.state === "pre" && new Date(e.date) - Date.now() < 15 * 60 * 1000 && new Date(e.date) > Date.now() - 3600e3);
  stamp(anyLive || startsSoon);
}


// ---- Timeline -------------------------------------------------------------
function secs(clock) {
  const [m, s] = String(clock || "0:00").split(":").map(Number);
  return (m || 0) * 60 + (s || 0);
}
function elapsed(period, clock) {
  const left = secs(clock);
  return period <= 4 ? (period - 1) * 900 + (900 - left) : 3600 + (period - 5) * 600 + (600 - left);
}

function parseSummary(sum) {
  const plays = [];
  const drives = [...(sum.drives?.previous || []), ...(sum.drives?.current ? [sum.drives.current] : [])];
  for (const d of drives) for (const p of d.plays || []) plays.push(p);
  const when = new Map(plays.map(p => [p.id, elapsed(p.period?.number || 1, p.clock?.displayValue)]));
  const seen = new Set();
  const turnovers = plays.filter(p => p.isTurnover && !p.scoringPlay && !seen.has(p.id) && seen.add(p.id)).map(p => ({
    t: when.get(p.id), team: p.end?.team?.id,
    label: /interception/i.test(p.type?.text || "") ? "INT" : "FUM", text: p.text,
  }));
  const scores = (sum.scoringPlays || []).map(p => ({
    t: elapsed(p.period?.number || 1, p.clock?.displayValue), team: p.team?.id,
    label: { TD: "TD", FG: "FG", SF: "SF" }[p.scoringType?.abbreviation || p.type?.abbreviation] || "PTS",
    text: `${p.text} (${p.awayScore}-${p.homeScore})`,
  }));
  const wp = (sum.winprobability || []).map(w => [when.get(w.playId), w.homeWinPercentage]).filter(([t]) => t != null);
  const maxPeriod = Math.max(4, ...plays.map(p => p.period?.number || 1));
  return { scores, turnovers, wp, maxPeriod };
}

function timeline(ev, data) {
  const comp = ev.competitions[0];
  const st = ev.status;
  const home = comp.competitors.find(c => c.homeAway === "home");
  const away = comp.competitors.find(c => c.homeAway === "away");
  const periods = Math.max(data?.maxPeriod || 4, st.period || 4);
  const total = 3600 + Math.max(0, periods - 4) * 600;
  const x = (t) => 3 + 94 * Math.max(0, Math.min(1, t / total));

  let html = "";
  for (let p = 1; p <= periods; p++) {
    const start = p <= 4 ? (p - 1) * 900 : 3600 + (p - 5) * 600;
    html += `<div class="q" style="left:${x(start)}%"><span>${p <= 4 ? "Q" + p : "OT"}</span></div>`;
  }
  html += '<div class="mid"></div>';
  if (!data) return html;

  if (data.wp.length > 1) {
    const pts = data.wp.map(([t, h]) => `${x(t).toFixed(2)},${(h * 100).toFixed(1)}`).join(" ");
    html += `<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><polyline class="wp" points="${pts}"/></svg>`;
  }
  if (st.type.state === "in") {
    const now = x(elapsed(st.period || 1, st.displayClock));
    html += `<div class="fut" style="left:${now}%"></div><div class="now" style="left:${now}%"></div>`;
  }
  const colorOf = (id) => (id === home.team.id ? "var(--h)" : "var(--a)");
  const sideOf = (id) => (id === home.team.id ? "home" : "away");
  for (const e of data.turnovers) {
    if (e.t == null || !e.team) continue;
    html += `<span class="ev to ${sideOf(e.team)}" style="left:${x(e.t)}%;--c:${colorOf(e.team)}" title="${e.label}: ${esc(e.text)}"></span>`;
  }
  for (const e of data.scores) {
    if (!e.team) continue;
    html += `<span class="ev ${e.label.toLowerCase()} ${sideOf(e.team)}" style="left:${x(e.t)}%;--c:${colorOf(e.team)}" title="${e.label}: ${esc(e.text)}"></span>`;
  }
  return html;
}

function scoreKey(ev) {
  return ev.competitions[0].competitors.map(c => c.score).join("-") + "|" + ev.status.type.state;
}
const prevScores = new Map(); // "eventId:teamId" -> score, to animate changes

async function loadTimelines(events) {
  await Promise.all(events.filter(e => e.status.type.state !== "pre").map(async (ev) => {
    const cached = summaries.get(ev.id);
    if (cached && cached.final) return;
    const key = scoreKey(ev);
    if (cached && cached.key === key && Date.now() - cached.at < 60000) return;
    try {
      const res = await fetch(API.replace("/scoreboard", "/summary") + "?event=" + ev.id, { cache: "no-store" });
      if (!res.ok) return;
      const data = parseSummary(await res.json());
      data.final = ev.status.type.state === "post";
      data.key = key;
      data.at = Date.now();
      summaries.set(ev.id, data);
      const el = document.querySelector(`.tl[data-id="${ev.id}"]`);
      const out = timeline(ev, data);
      if (el && el.innerHTML !== out) el.innerHTML = out;
    } catch { /* timeline is a nice-to-have; leave the empty strip */ }
  }));
}

function hashStr(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0;
  return (h >>> 0).toString(36);
}

// Mini field for a live game. Away team defends the left end zone and drives
// right; home defends the right. ESPN's yardLine is the number on the field
// (0-50); possessionText ("BAL 47") says whose half it's in. We convert it to
// yards from the home goal line.
function fieldView(sit, away, home) {
  const [sideAbbr, num] = String(sit.possessionText || "").split(" ");
  const n = Number(num ?? sideAbbr);
  const line = !Number.isFinite(n) ? NaN
    : sideAbbr === home.team.abbreviation ? n
    : sideAbbr === away.team.abbreviation ? 100 - n
    : 50;
  const ball = sit.possession;
  const known = Number.isFinite(line) && (ball === home.team.id || ball === away.team.id);
  const pos = (yds) => 8 + 84 * ((100 - yds) / 100); // % across, inside end zones
  let marks = "";
  if (known) {
    const dir = ball === away.team.id ? 1 : -1;      // +1 = toward the right
    const ballX = pos(line);
    if (sit.distance && sit.down) {
      const fd = Math.max(0, Math.min(100, line - dir * sit.distance));
      const toX = pos(fd);
      marks += `<span class="gain" style="left:${Math.min(ballX, toX)}%;width:${Math.abs(toX - ballX)}%"></span>`;
      marks += `<span class="fd" style="left:${toX}%"></span>`;
    }
    marks += `<span class="fb ${dir > 0 ? "r" : "l"}" style="left:${ballX}%"></span>`;
  }
  const text = sit.downDistanceText || sit.possessionText || "";
  const last = sit.lastPlay?.text || "";
  return `<div class="field">
    <div class="pitch"><span class="ez a"></span><span class="ez h"></span>${[20, 40, 60, 80].map(y => `<span class="yl" style="left:${8 + 84 * y / 100}%"></span>`).join("")}<span class="yl fifty" style="left:50%"></span>${marks}</div>
    <div class="sit">${sit.isRedZone ? '<b class="rzt">Red zone</b>' : ""}${esc(text)}${last ? `<span class="last">${esc(last.trim())}</span>` : ""}</div>
  </div>`;
}

function gameCard(ev) {
  const comp = ev.competitions[0];
  const st = ev.status;
  const state = st.type.state; // pre | in | post
  const home = comp.competitors.find(c => c.homeAway === "home");
  const away = comp.competitors.find(c => c.homeAway === "away");
  const decided = state === "post" && (home.winner || away.winner);
  const hex = (v, fb) => (/^[0-9a-f]{6}$/i.test(v || "") ? "#" + v : fb);

  const sit = state === "in" ? comp.situation : null;
  const side = (c, which) => {
    const t = c.team;
    const k = ev.id + ":" + t.id;
    const prev = prevScores.get(k);
    const bumped = prev != null && c.score != null && prev !== c.score;
    if (c.score != null) prevScores.set(k, c.score);
    const hasBall = sit && sit.possession === t.id;
    const tos = sit ? sit[which + "Timeouts"] : null;
    const logo = esc(t.logo || "");
    const rec = c.records?.find(r => r.type === "total")?.summary || c.records?.[0]?.summary || "";
    const sub = state === "pre" && rec ? `${t.shortDisplayName} · ${rec}` : t.shortDisplayName;
    return `<div class="side ${which}${decided && !c.winner ? " lost" : ""}${bumped ? " bump" : ""}">
      ${logo ? `<img class="mark" src="${logo}" alt="" loading="lazy" onerror="this.remove()">` : ""}
      ${logo ? `<img class="logo" src="${logo}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">` : ""}
      <div class="id"><span class="ab">${esc(t.abbreviation || "")}${hasBall ? '<i class="ball" title="Has the ball"></i>' : ""}</span><span class="nm">${tos != null ? `<span class="tos" title="${tos} timeouts left">${[0,1,2].map(i => `<b class="${i < tos ? "on" : ""}"></b>`).join("")}</span>` : esc(sub || "")}</span></div>
      ${state === "pre" ? "" : `<span class="sc">${esc(c.score ?? "")}</span>`}
    </div>`;
  };

  const tv = [...new Set((comp.broadcasts || []).flatMap(b => b.names || []))].join(", ");
  let pill;
  if (state === "pre") {
    const t = comp.timeValid === false ? "TBD"
      : new Date(ev.date).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
    pill = `<div class="pill">${esc(t)}${tv ? `<small>${esc(tv)}</small>` : ""}</div>`;
  } else if (state === "in") {
    const clock = st.type.name === "STATUS_IN_PROGRESS" && st.period
      ? `${st.period > 4 ? "OT" : "Q" + st.period} ${st.displayClock}`
      : st.type.shortDetail;
    pill = `<div class="pill live">${esc(clock)}${tv ? `<small>${esc(tv)}</small>` : ""}</div>`;
  } else {
    pill = `<div class="pill">${esc(st.type.shortDetail)}</div>`;
  }

  const vars = `--a:${hex(away.team.color, "#333")};--h:${hex(home.team.color, "#333")}`;
  const field = sit ? fieldView(sit, away, home) : "";
  const tl = state === "pre" ? "" : `<div class="tl" data-id="${esc(ev.id)}">${timeline(ev, summaries.get(ev.id))}</div>`;
  const body = `${side(away, "away")}${side(home, "home")}${pill}${field}${tl}`;
  return `<article class="game ${state === "post" ? "final" : state}${tl ? " has-tl" : ""}${sit?.isRedZone ? " rz" : ""}" data-id="${esc(ev.id)}" data-sig="${hashStr(body)}" style="${vars}">
    ${body}
  </article>`;
}

// Swap in new markup without blowing away the page: if the same games are on
// screen, only replace the tiles that changed. Scroll position never moves.
function patchMain(html) {
  const main = $("main");
  const next = document.createElement("div");
  next.innerHTML = html;
  const ids = (root) => [...root.querySelectorAll("article.game")].map(a => a.dataset.id).join(",");
  if (main.querySelector("article.game") && ids(main) === ids(next)) {
    for (const fresh of next.querySelectorAll("article.game")) {
      const old = main.querySelector(`article.game[data-id="${fresh.dataset.id}"]`);
      if (old && old.dataset.sig !== fresh.dataset.sig) old.replaceWith(fresh);
    }
    main.querySelectorAll(".dayhead").forEach((el, i) => {
      const n = next.querySelectorAll(".dayhead")[i];
      if (n && el.outerHTML !== n.outerHTML) el.replaceWith(n);
    });
  } else {
    const y = window.scrollY;
    main.replaceChildren(...next.childNodes);
    window.scrollTo(0, y);
  }
}

function stamp(live) {
  $("updated").textContent = "Updated " + new Date().toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
  clearTimeout(timer);
  if (live) timer = setTimeout(() => loadWeek(true), 15000); // keep scores fresh during games
}

function showError(err) {
  $("main").innerHTML = `<div class="msg">Couldn't load the schedule (${esc(err.message)}).<br>Try refresh.</div>`;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

$("prev").onclick = () => { if (idx > 0) { idx--; loadWeek(); } };
$("next").onclick = () => { if (idx < weeks.length - 1) { idx++; loadWeek(); } };
$("refresh").onclick = () => (idx >= 0 ? loadWeek(true) : init());
document.addEventListener("visibilitychange", () => { if (!document.hidden && idx >= 0) loadWeek(true); });

init();
</script>
</body>
</html>
